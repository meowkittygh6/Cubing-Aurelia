<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurelia — Chronometer</title>
<meta name="theme-color" content="#07060E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aurelia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Optional. If there is no network the app falls back to system faces and
     works exactly the same; nothing here is required to run. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
/* ============================================================================
   AURELIA — the house style.
   Three worlds, one set of manners: deep grounds, champagne metal, a serif
   that behaves like engraving, and generous air. Nothing floats over
   anything else; every surface is a plate with an edge.
   ========================================================================== */
:root{
  --f-display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,
    "Book Antiqua","Songti SC","Noto Serif CJK SC",Georgia,serif;
  --f-ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable","Segoe UI",
    "PingFang SC","Noto Sans CJK SC",sans-serif;

  --ink-0:#07060E;   --ink-1:#0D0B18;   --ink-2:#151125;
  --plate:rgba(19,15,32,.78);
  --plate-2:rgba(26,20,44,.88);
  --line:rgba(233,201,127,.26);
  --line-soft:rgba(233,201,127,.13);
  --gold:#EBCB88;  --gold-2:#C9A65E;  --gold-deep:#8C6F33;
  --rose:#EAA9BE;  --mist:#D5CDE8;
  --text:#F4F0FA;  --text-2:#C7BEDC;  --text-3:#9C93B4;
  --good:#9FDDB6;  --warn:#F2BC79;  --bad:#EE9494;
  --glow:rgba(235,203,136,.30);
  --r-lg:20px; --r-md:13px; --r-sm:8px;
  --ease:cubic-bezier(.22,.72,.24,1);
  --dur:.42s;
  --dock-h:0px;
}
html[data-world="shore"]{
  --ink-0:#05080F; --ink-1:#0A1120; --ink-2:#132038;
  --plate:rgba(14,26,45,.78); --plate-2:rgba(19,34,58,.90);
  --line:rgba(239,201,138,.26); --line-soft:rgba(239,201,138,.13);
  --gold:#F0CE90; --gold-2:#D0A967; --rose:#F2AE96;
  --text:#F5F1E8; --text-2:#BFCEDF; --text-3:#8FA1B8;
  --glow:rgba(240,206,144,.28);
}
html[data-world="hng"]{
  --ink-0:#0B0805; --ink-1:#150F09; --ink-2:#241a10;
  --plate:rgba(32,22,14,.80); --plate-2:rgba(44,30,18,.90);
  --line:rgba(242,201,124,.28); --line-soft:rgba(242,201,124,.14);
  --gold:#F4CE86; --gold-2:#CFA35C; --rose:#EAB394;
  --text:#FAF2E4; --text-2:#D6C4A8; --text-3:#AC9A80;
  --glow:rgba(244,206,134,.26);
}
html[data-world="hng"][data-tod="night"]{
  --ink-0:#05070E; --ink-1:#0B1020; --plate:rgba(18,24,42,.80);
  --text-2:#C3CBDA; --text-3:#93A0B6;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink-0);color:var(--text);
  font-family:var(--f-ui);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
  transition:background var(--dur) var(--ease);
}
body[data-fontscale="l"]{font-size:16.5px}
body[data-fontscale="xl"]{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;color:inherit}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:3px;border-radius:4px}
::selection{background:rgba(235,203,136,.26)}
.hidden{display:none!important}

/* ------------------------------- scene ---------------------------------- */
#scene,#sceneFx{position:fixed;inset:0;width:100%;height:100%;display:block}
#scene{z-index:0} #sceneFx{z-index:1;pointer-events:none}
#vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(130% 90% at 50% 6%, transparent 42%, rgba(0,0,0,.42) 100%),
    linear-gradient(180deg, rgba(0,0,0,.42) 0%, transparent 24%, transparent 58%, rgba(0,0,0,.52) 100%);
  transition:background var(--dur) var(--ease)}
body.solving #vignette{background:radial-gradient(115% 82% at 50% 46%, rgba(0,0,0,.10) 0%, rgba(0,0,0,.88) 76%)}

/* ------------------------------- shell ---------------------------------- */
#shell{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;
  pointer-events:none}
#shell>*{pointer-events:auto}
#stage{pointer-events:none}
#stage>*{pointer-events:auto}

/* ------------------------------ header ---------------------------------- */
header#top{
  display:flex;align-items:center;gap:16px;
  padding:12px clamp(14px,2.4vw,30px) 11px;
  border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(6,5,12,.72),rgba(6,5,12,.16) 70%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.crest{width:30px;height:30px;flex:0 0 auto;filter:drop-shadow(0 0 8px var(--glow))}
.wordmark{display:flex;flex-direction:column;line-height:1;margin-right:auto;min-width:0}
.wordmark b{
  font-family:var(--f-display);font-weight:500;font-size:clamp(21px,2.5vw,30px);
  letter-spacing:.30em;white-space:nowrap;
  background:linear-gradient(100deg,var(--gold-2) 0%,#FFF3D2 34%,var(--gold) 62%,var(--gold-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 10px rgba(0,0,0,.5));
}
.wordmark span{
  font-size:10px;letter-spacing:.26em;color:var(--text-3);margin-top:7px;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44ch;
}
.tools{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.icobtn{
  width:37px;height:37px;border-radius:10px;display:grid;place-items:center;
  border:1px solid var(--line-soft);background:rgba(255,255,255,.035);
  color:var(--text-2);transition:all .2s var(--ease);
}
.icobtn:hover{border-color:var(--line);background:rgba(255,255,255,.09);color:var(--text)}
.icobtn:active{transform:scale(.94)}
.icobtn.on{border-color:var(--gold);background:var(--glow);color:var(--gold)}
.icobtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}
.langswitch{display:flex;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;
  background:rgba(255,255,255,.03)}
.langswitch button{padding:9px 12px;font-size:11px;letter-spacing:.16em;color:var(--text-3);
  transition:all .25s var(--ease)}
.langswitch button+button{border-left:1px solid var(--line-soft)}
.langswitch button:hover{color:var(--text)}
.langswitch button[aria-pressed="true"]{
  background:linear-gradient(180deg,var(--gold),var(--gold-2));color:#241A05;font-weight:600}

/* ----------------------------- epigraph --------------------------------- */
#epigraph{
  flex:0 0 auto;display:flex;align-items:baseline;justify-content:center;gap:12px;
  padding:11px 24px 10px;text-align:center;
  border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(6,5,12,.34),transparent);
  transition:opacity .5s var(--ease);
}
#epigraph.in .qt{animation:fadeUp .7s var(--ease)}
#epigraph .qt{font-family:var(--f-display);font-style:italic;font-weight:400;
  font-size:clamp(14px,1.55vw,19px);color:var(--text-2);letter-spacing:.012em;
  max-width:70ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#epigraph .qs{font-size:9.5px;letter-spacing:.22em;color:var(--text-3);
  text-transform:uppercase;white-space:nowrap;flex:0 0 auto}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ------------------------------- main ----------------------------------- */
main{flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(240px,290px) minmax(0,1fr) minmax(280px,352px);
  gap:clamp(12px,1.5vw,22px);
  padding:clamp(12px,1.6vw,20px) clamp(14px,2.4vw,30px) clamp(14px,1.8vw,22px);
}
.rail{min-height:0;display:flex;flex-direction:column;gap:14px;overflow:hidden}

@keyframes panelIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#railLeft .panel{animation:panelIn .6s var(--ease) backwards}
#railRight .panel{animation:panelIn .6s var(--ease) .10s backwards}
#railLeft .panel+.panel{animation-delay:.06s}
#railRight .panel+.panel{animation-delay:.16s}
header#top{animation:panelIn .5s var(--ease) backwards}
@media(max-width:1140px){#railLeft .panel,#railRight .panel{animation:none}}
/* ------------------------------ plates ---------------------------------- */
.panel{
  position:relative;
  background:var(--plate);
  backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);
  border:1px solid var(--line-soft);border-radius:var(--r-lg);
  box-shadow:0 22px 52px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.06);
  display:flex;flex-direction:column;min-height:0;
}
.panel::after{                     /* an inner hairline, the way good stationery has one */
  content:"";position:absolute;inset:5px;border:1px solid var(--line-soft);
  border-radius:calc(var(--r-lg) - 5px);pointer-events:none;opacity:.55;
}
.panel>h2{
  margin:0;padding:15px 20px 11px;
  font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:.14em;
  color:var(--gold);text-transform:uppercase;
  display:flex;align-items:baseline;gap:10px;position:relative;
}
.panel>h2 em{font-style:normal;font-size:10px;letter-spacing:.18em;color:var(--text-3);
  margin-left:auto;text-transform:none;font-family:var(--f-ui)}
.panel>h2::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:1px;
  background:linear-gradient(90deg,var(--line),transparent 78%)}
.panel .body{padding:14px 20px 18px;overflow:auto;min-height:0}
.panel .body::-webkit-scrollbar{width:6px}
.panel .body::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.panel .body::-webkit-scrollbar-track{background:transparent}

/* --------------------------- centre stage ------------------------------- */
#stage{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:clamp(10px,1.9vh,20px);min-height:0;padding:4px 0}
#stage::before,#stage::after{content:"";flex:0 0 0;margin:auto 0;min-height:2px}
#scrambleBar{
  position:relative;max-width:min(740px,94%);text-align:center;
  font-family:var(--f-ui);font-weight:300;
  font-size:clamp(14px,1.75vw,21px);letter-spacing:.055em;line-height:1.75;
  color:var(--text);padding:13px 26px;border-radius:var(--r-md);cursor:pointer;
  background:rgba(9,7,18,.44);border:1px solid var(--line-soft);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:border-color .2s,background .2s;
}
#scrambleBar:hover{border-color:var(--line);background:rgba(9,7,18,.62)}
#scrambleBar::before,#scrambleBar::after{        /* corner ticks */
  content:"";position:absolute;width:9px;height:9px;border:1px solid var(--gold);opacity:.55}
#scrambleBar::before{left:6px;top:6px;border-right:0;border-bottom:0}
#scrambleBar::after{right:6px;bottom:6px;border-left:0;border-top:0}
#scrambleMeta{font-size:10px;letter-spacing:.22em;color:var(--text-3);text-transform:uppercase}
#clock{
  font-family:var(--f-ui);font-variant-numeric:tabular-nums;
  font-weight:200;font-size:clamp(64px,15vw,170px);line-height:.95;
  letter-spacing:-.025em;color:var(--text);user-select:none;
  text-shadow:0 6px 46px rgba(0,0,0,.62);
  transition:color .18s,transform .2s var(--ease),text-shadow .3s;
}
#clock .ms{font-size:.5em;color:var(--text-3);letter-spacing:0}
#clock.ready{color:var(--good);text-shadow:0 0 68px rgba(159,221,182,.42)}
@keyframes clockLand{0%{transform:scale(1)}30%{transform:scale(1.045)}100%{transform:scale(1)}}
#clock.land{animation:clockLand .5s var(--ease)}
@keyframes scrIn{from{opacity:.15;transform:translateY(-3px)}to{opacity:1;transform:none}}
#scrambleBar.fresh{animation:scrIn .45s var(--ease)}
#clock.hold{color:var(--warn)}
#clock.run{color:var(--gold);text-shadow:0 0 76px var(--glow)}
#clock.insp{color:var(--rose)}

/* ------------------------- the chronometer ------------------------------ */
#clockWrap{position:relative;display:grid;place-items:center;padding:26px 40px 8px;
  min-width:min(560px,92vw)}
#clockWrap::before,#clockWrap::after{content:"";position:absolute;width:26px;height:26px;
  border:1px solid var(--line);opacity:.55;transition:opacity .3s,border-color .3s}
#clockWrap::before{left:0;top:0;border-right:0;border-bottom:0}
#clockWrap::after{right:0;bottom:0;border-left:0;border-top:0}
body.solving #clockWrap::before,body.solving #clockWrap::after{opacity:.16}
#clockTicks{position:relative;width:min(72%,420px);height:5px;opacity:.5;margin:0 auto;
  background:repeating-linear-gradient(90deg,var(--gold) 0 1px,transparent 1px 9px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
#clockGhost{grid-area:2/1;
  font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-weight:200;
  font-size:clamp(64px,15vw,170px);line-height:.95;letter-spacing:-.025em;
  color:var(--gold);opacity:.055;pointer-events:none;user-select:none}
#clockGhost .ms{font-size:.5em;letter-spacing:0}
#clock{grid-area:2/1;position:relative;z-index:1}
#clockTicks{grid-area:1/1}
#clockHud{grid-area:3/1}
#clockWrap{grid-template-rows:auto auto auto;row-gap:10px}
#clockHud{display:flex;align-items:center;gap:10px;justify-content:center;
  font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--text-3)}
#clockHud i{display:block;width:3px;height:3px;transform:rotate(45deg);
  background:var(--gold);opacity:.6}
#clockHud span{white-space:nowrap}
#clockHud .live{color:var(--gold)}
body.solving #clockHud,body.solving #clockTicks,body.solving #clockGhost{opacity:0}
#clockWrap.armed::before,#clockWrap.armed::after{border-color:var(--good);opacity:.9}
#clockWrap.run::before,#clockWrap.run::after{border-color:var(--gold);opacity:.9}
#solveTools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:36px}
#previewWrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
#preview{filter:drop-shadow(0 12px 26px rgba(0,0,0,.55));max-width:min(92vw,440px);height:auto}
#selectors{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center}

/* ----------------------------- controls --------------------------------- */
.pillbtn{
  padding:8px 17px;border-radius:999px;border:1px solid var(--line-soft);
  font-size:12.5px;letter-spacing:.07em;color:var(--text-2);
  background:rgba(255,255,255,.035);transition:all .2s var(--ease);white-space:nowrap}
.pillbtn:hover{color:var(--text);border-color:var(--line);background:rgba(255,255,255,.09)}
.pillbtn.active{background:linear-gradient(180deg,var(--gold),var(--gold-2));
  color:#241A05;border-color:var(--gold);font-weight:600}
.pillbtn.danger:hover{border-color:var(--bad);color:var(--bad)}
select.lux,input.lux,textarea.lux{
  background:rgba(8,6,16,.62);border:1px solid var(--line-soft);border-radius:9px;
  padding:9px 13px;font-size:13px;color:var(--text);transition:border-color .2s;
  appearance:none;-webkit-appearance:none}
select.lux{padding-right:32px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23C7BEDC' stroke-width='1.4' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;background-size:11px}
select.lux option,select.lux optgroup{background:#140F22;color:var(--text)}
select.lux:focus,input.lux:focus,textarea.lux:focus{border-color:var(--gold);outline:none}
textarea.lux{width:100%;resize:vertical;min-height:82px;line-height:1.6}
label.field{display:block;margin-bottom:14px}
label.field>span{display:block;font-size:10px;letter-spacing:.19em;color:var(--text-3);
  margin-bottom:7px;text-transform:uppercase}
label.field>input,label.field>select,label.field>textarea{width:100%}

/* ------------------------------ figures --------------------------------- */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:var(--r-md);overflow:hidden}
.stat{background:rgba(9,7,18,.46);padding:12px 14px}
.stat b{display:block;font-family:var(--f-ui);font-variant-numeric:tabular-nums;
  font-weight:300;font-size:21px;letter-spacing:-.015em;color:var(--text)}
.stat span{display:block;font-size:9px;letter-spacing:.20em;color:var(--text-3);
  margin-top:4px;text-transform:uppercase}
.stat.hero{background:rgba(235,203,136,.07)}
.stat.hero b{font-size:30px;color:var(--gold);font-weight:300}
.statline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
  border-bottom:1px solid var(--line-soft);font-size:13px}
.statline:last-child{border-bottom:0}
.statline span{color:var(--text-3)}
.statline b{font-weight:400;font-variant-numeric:tabular-nums;color:var(--text)}
#goalRing{display:flex;align-items:center;gap:15px;padding:14px 0 6px}
#goalRing b{display:block;font-size:14px;font-weight:400}
#goalRing small{color:var(--text-3);font-size:11.5px;line-height:1.5;display:block}

/* ------------------------------ ledger ---------------------------------- */
#solveFilter{padding:12px 20px 12px}
.solverow{
  display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;
  padding:10px 11px;border-radius:9px;cursor:pointer;transition:background .16s;
  border-bottom:1px solid var(--line-soft)}
.solverow:hover{background:rgba(255,255,255,.07)}
.solverow .idx{font-size:10px;color:var(--text-3);font-variant-numeric:tabular-nums;
  text-align:right}
.solverow .tm{font-variant-numeric:tabular-nums;font-size:17px;font-weight:300;color:var(--text)}
.solverow .sub{font-size:10.5px;color:var(--text-3);letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.solverow .tag{font-size:9.5px;letter-spacing:.12em;color:var(--text-3)}
.solverow.pb{background:linear-gradient(90deg,rgba(235,203,136,.10),transparent)}
.solverow.pb .tm{color:var(--gold)}
.solverow.pb .tag{color:var(--gold)}
.solverow.dnf .tm{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.emptystate{padding:30px 12px;text-align:center;color:var(--text-3);font-size:13px;line-height:1.75}
.emptystate b{display:block;font-family:var(--f-display);font-size:21px;color:var(--gold);
  margin-bottom:10px;font-weight:400;letter-spacing:.08em}

/* --------------------- companion, and the dialogue ---------------------- */
#companionPanel .body{padding:0}
#companion{padding:16px 18px 18px;display:flex;gap:14px;align-items:flex-start}
#companion .portrait{flex:0 0 auto;width:64px;height:64px;border-radius:50%;overflow:hidden;
  border:1px solid var(--line);box-shadow:0 0 22px var(--glow),inset 0 0 18px rgba(0,0,0,.5)}
#companion .portrait canvas{display:block;width:64px;height:64px}
#companion .say{min-width:0;flex:1}
#companion .who{font-family:var(--f-display);font-size:16px;letter-spacing:.14em;
  color:var(--gold);text-transform:uppercase}
#companion .role{font-size:10px;letter-spacing:.16em;color:var(--text-3);margin-top:2px}
#companion .line{font-family:var(--f-display);font-size:17px;line-height:1.55;
  color:var(--text);margin-top:8px}
#companion .line.fade{animation:fadeUp .5s var(--ease)}

#vn{
  position:fixed;left:50%;transform:translate(-50%,16px);
  bottom:calc(22px + var(--dock-h));z-index:34;
  width:min(760px,calc(100vw - 32px));
  display:flex;gap:16px;align-items:flex-start;
  padding:16px 20px 17px;border-radius:18px;
  background:linear-gradient(180deg,var(--plate-2),rgba(8,6,16,.94));
  border:1px solid var(--line);
  box-shadow:0 26px 64px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  opacity:0;pointer-events:none;transition:opacity .42s var(--ease),transform .42s var(--ease)}
#vn.show{opacity:1;transform:translate(-50%,0)}
#vn .face{flex:0 0 auto;width:64px;height:64px;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);box-shadow:0 0 20px var(--glow)}
#vn .face canvas{display:block;width:64px;height:64px}
#vn .said{min-width:0;flex:1}
#vn .nameplate{display:inline-flex;align-items:center;gap:8px;margin-bottom:7px}
#vn .nameplate b{font-family:var(--f-display);font-size:14px;letter-spacing:.20em;
  color:var(--gold);text-transform:uppercase;font-weight:500}
#vn .nameplate i{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);
  min-width:34px;display:block}
#vn .msg{font-family:var(--f-display);font-size:clamp(17px,1.9vw,21px);line-height:1.5;
  color:var(--text)}
body.solving #vn,body.zen #vn{opacity:0!important;pointer-events:none}

/* ------------------------------- dock ----------------------------------- */
#dock{display:none}

/* ------------------------------ modals ---------------------------------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(4,3,9,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:grid;place-items:center;padding:18px;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  width:min(880px,100%);max-height:min(88vh,960px);display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--plate-2),rgba(9,7,17,.98));
  border:1px solid var(--line);border-radius:22px;overflow:hidden;position:relative;
  box-shadow:0 44px 110px rgba(0,0,0,.66);
  transform:translateY(14px) scale(.985);transition:transform .34s var(--ease)}
.sheet::after{content:"";position:absolute;inset:6px;border:1px solid var(--line-soft);
  border-radius:16px;pointer-events:none;opacity:.5}
.scrim.open .sheet{transform:none}
.sheet>header{display:flex;align-items:center;gap:12px;padding:18px 22px 14px;
  border-bottom:1px solid var(--line-soft)}
.sheet>header h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:23px;
  letter-spacing:.16em;color:var(--gold);margin-right:auto;text-transform:uppercase}
.sheet .content{padding:20px 22px 26px;overflow:auto}
.sheet .content::-webkit-scrollbar{width:7px}
.sheet .content::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.tabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.tabs button{padding:12px 12px;font-size:11.5px;letter-spacing:.13em;color:var(--text-3);
  border-bottom:2px solid transparent;margin-bottom:-1px;text-transform:uppercase;
  transition:color .2s}
.tabs button:hover{color:var(--text-2)}
.tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}

.rowline{display:flex;gap:14px;align-items:center;padding:13px 0;
  border-bottom:1px solid var(--line-soft)}
.rowline:last-child{border-bottom:0}
.rowline .grow{flex:1;min-width:0}
.rowline small{display:block;color:var(--text-3);font-size:11.5px;line-height:1.55;margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.sw{width:46px;height:26px;border-radius:999px;background:rgba(255,255,255,.09);
  border:1px solid var(--line-soft);position:relative;flex:0 0 auto;transition:all .22s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--text-3);transition:transform .26s var(--ease),background .22s}
.sw[aria-checked="true"]{background:var(--glow);border-color:var(--gold)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--gold)}
.chipset{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line-soft);font-size:12px;
  color:var(--text-3);transition:all .18s}
.chip:hover{color:var(--text);border-color:var(--line)}
.chip.on{background:linear-gradient(180deg,var(--gold),var(--gold-2));color:#241A05;
  border-color:var(--gold);font-weight:600}
.hint{font-size:12.5px;color:var(--text-3);line-height:1.7;margin:9px 0 0}
.divider{height:1px;margin:22px 0;position:relative;
  background:linear-gradient(90deg,transparent,var(--line-soft) 18%,var(--line-soft) 82%,transparent)}
.divider::after{content:"";position:absolute;left:50%;top:-3px;width:6px;height:6px;
  transform:translateX(-50%) rotate(45deg);background:var(--gold);opacity:.55}
h4.sec{font-family:var(--f-display);font-weight:500;font-size:18px;letter-spacing:.14em;
  color:var(--gold);margin:24px 0 10px;text-transform:uppercase}
h4.sec:first-child{margin-top:0}
.kbd{display:inline-block;padding:3px 8px;border-radius:6px;border:1px solid var(--line-soft);
  font-size:11px;color:var(--text-2);background:rgba(255,255,255,.03)}
.badge{font-size:9px;letter-spacing:.18em;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--gold);text-transform:uppercase}
.mini{font-size:11.5px;color:var(--text-3)}
canvas.chart{width:100%;display:block;border-radius:var(--r-md);
  border:1px solid var(--line-soft);background:rgba(9,7,18,.4)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,10px);gap:2px;
  overflow-x:auto;padding-bottom:6px}
.heat i{width:10px;height:10px;border-radius:2px;background:rgba(255,255,255,.055);display:block}
.recgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:1px;
  background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--r-md);
  overflow:hidden}
#btnSave.bad{border-color:var(--warn);color:var(--warn)}
#btnSave.busy{opacity:.55}
#breathStage{display:grid;place-items:center;gap:22px;padding:18px 0 6px;text-align:center}
#breathOrb{width:min(230px,58vw);aspect-ratio:1;border-radius:50%;position:relative;
  background:radial-gradient(circle at 38% 34%,rgba(255,255,255,.42),var(--glow) 42%,transparent 72%);
  border:1px solid var(--line);transition:transform 4s cubic-bezier(.4,0,.5,1);
  display:grid;place-items:center}
#breathOrb span{font-family:var(--f-display);font-size:22px;letter-spacing:.16em;color:var(--text)}
#breathOrb.in{transform:scale(1.28)} #breathOrb.out{transform:scale(.78)}


/* --------------------- readability over a busy scene ---------------------
   The scene is a photograph; the interface is paper laid on top of it. In
   "solid" mode the plates stop pretending to be glass, which is the only
   honest way to keep small type legible over a lit skyline.               */
body[data-ui="solid"]{
  --plate:rgba(11,8,20,.93);
  --plate-2:rgba(15,11,26,.97);
  --text-2:#D7CFE8;
  --text-3:#B3A9C6;
}
html[data-world="shore"] body[data-ui="solid"],
body[data-ui="solid"] html[data-world="shore"]{--plate:rgba(7,13,24,.93)}
body[data-ui="solid"] .panel{backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:0 24px 56px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.07)}
body[data-ui="solid"] #vn{backdrop-filter:none;-webkit-backdrop-filter:none;
  background:linear-gradient(180deg,rgba(16,12,28,.97),rgba(7,5,14,.99))}
body[data-ui="solid"] #scrambleBar{background:rgba(9,7,18,.88)}
body[data-ui="solid"] #epigraph{background:linear-gradient(180deg,rgba(6,5,12,.80),rgba(6,5,12,.42))}
body[data-ui="solid"] header#top{background:linear-gradient(180deg,rgba(5,4,10,.92),rgba(5,4,10,.62))}
/* the stage text always gets a shadow, whatever the mode */
#clock,#clockHud,#scrambleMeta,#epigraph .qt{text-shadow:0 2px 14px rgba(0,0,0,.85)}

/* ------------------------- leaving zen ---------------------------------- */
#zenExit{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:38;display:none;align-items:center;gap:8px;
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);
  background:rgba(10,8,18,.92);color:var(--gold);
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  box-shadow:0 12px 30px rgba(0,0,0,.5)}
#zenExit svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
body.zen #zenExit{display:flex}
body.zen.solving #zenExit{display:none}

/* --------------------- nothing gets cut off any more --------------------
   The stage scrolls if the viewport is too short for it, and every control
   keeps a finger-sized target with room underneath the last row.          */
main{min-height:0}
#stage{overflow-y:auto;overflow-x:hidden;padding:6px 4px 10px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#stage::-webkit-scrollbar{width:6px}
#stage::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.pillbtn{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
#dock button{min-height:44px}
.icobtn{min-width:37px}
.chip{min-height:34px;display:inline-flex;align-items:center}
/* ---------------------------- responsive -------------------------------- */
@media(max-width:1140px){
  :root{--dock-h:66px}
  main{grid-template-columns:1fr;padding-bottom:calc(var(--dock-h) + 12px)}
  #stage{padding-bottom:calc(var(--dock-h) + 26px)}
  .rail{position:fixed;left:0;right:0;bottom:calc(var(--dock-h));top:auto;max-height:58vh;
    padding:0 12px 10px;z-index:24;transform:translateY(112%);
    transition:transform .38s var(--ease);pointer-events:none}
  .rail.open{transform:none;pointer-events:auto}
  .rail .panel{max-height:58vh}
  #vn{bottom:calc(var(--dock-h) + 14px);width:calc(100vw - 20px);padding:13px 15px 14px}
  #vn .face,#vn .face canvas{width:52px;height:52px}
  #dock{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:26;height:var(--dock-h);
    border-top:1px solid var(--line-soft);background:rgba(6,5,12,.92);
    backdrop-filter:blur(18px);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
  #dock button{flex:1;display:grid;place-items:center;gap:4px;padding:6px 2px;
    font-size:9px;letter-spacing:.12em;color:var(--text-3);border-radius:11px;
    text-transform:uppercase}
  #dock button i{font-style:normal}
  #dock button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.4;
    stroke-linecap:round;stroke-linejoin:round}
  #dock button.on{color:var(--gold);background:rgba(255,255,255,.07)}
  #clock{font-size:clamp(58px,19vw,124px)}
  .wordmark span{display:none}
  #epigraph{padding:9px 16px 8px}
  #epigraph .qs{display:none}
}
@media(max-height:720px){
  #previewWrap{display:none}
  #clockWrap{padding:14px 28px 4px;row-gap:6px}
  #clockTicks{display:none}
  #epigraph{display:none}
}
@media(max-height:600px){
  #vn{padding:10px 13px 11px}
  #vn .msg{font-size:15px}
  #vn .face,#vn .face canvas{width:44px;height:44px}
}
@media(max-width:700px){
  header#top{gap:9px;padding:10px 13px 9px}
  .langswitch button{padding:8px 9px;font-size:10px;letter-spacing:.1em}
  .icobtn{width:34px;height:34px}
  .icobtn svg{width:16px;height:16px}
  #scrambleBar{padding:11px 18px}
}
body.zen header#top,body.zen .rail,body.zen #dock,body.zen #selectors,
body.zen #previewWrap,body.zen #epigraph{opacity:0;pointer-events:none;
  transition:opacity .45s var(--ease)}
body.solving #scrambleBar,body.solving #solveTools,body.solving #selectors,
body.solving #previewWrap,body.solving .rail,body.solving header#top,
body.solving #dock,body.solving #epigraph{
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.06ms!important}}
</style>
</head>
<body data-fontscale="m" data-motion="full">

  </div>
</header>

<button id="zenExit" title="Leave zen"><svg viewBox="0 0 24 24"><path d="M9 4.5H4.5V9M15 4.5h4.5V9M19.5 15v4.5H15M9 19.5H4.5V15"/></svg><span>Leave zen</span></button>

<div id="epigraph"></div>

<main>
  <!-- ============ LEFT RAIL ============ -->
  <div class="rail" id="railLeft">
    <div class="panel" style="flex:1">
      <h2 id="lblStats">Session<em id="sessName"></em></h2>
      <div class="body">
        <div class="statgrid" id="statGrid"></div>

<script>
/* ============================================================================
   LANGUAGE WORLDS

/* ----------------------------------------------------------------------------
   PERSISTENCE
   The store can fail — it is a network call, and network calls fail. So:
   writes are de-duplicated (never write an unchanged payload), coalesced
   (at most one in flight), retried with backoff, and if the store is still
   refusing after that, nothing is lost: the data stays in memory, the app
   says so plainly, and offers a file. Her solves are never the casualty.
-------------------------------------------------------------------------- */
const SAVE={ok:true,pending:false,inflight:false,last:0,err:"",tries:0,timer:null,payload:""};

async function load(){
  try{
    const r=await window.storage.get(KEY);
    if(r&&r.value){
      const d=JSON.parse(r.value);
      DB=Object.assign(DEFAULTS(),d);
      DB.settings=Object.assign(DEFAULTS().settings,d.settings||{});
      DB.settings.tones=Object.assign(DEFAULTS().settings.tones,(d.settings||{}).tones||{});
      DB.settings.custom=Object.assign({en:[],ru:[],hk:[]},(d.settings||{}).custom||{});
      DB.settings.goals=Object.assign({},(d.settings||{}).goals||{});
      SAVE.payload=r.value;
    }
  }catch(e){ /* first run, or the store is asleep — defaults stand */ }
  if(!DB.sessions.length)DB.sessions=DEFAULTS().sessions;
}
function save(){
  SAVE.pending=true;
  clearTimeout(SAVE.timer);
  SAVE.timer=setTimeout(flushSave,900);
}
async function flushSave(){
  if(SAVE.inflight){clearTimeout(SAVE.timer);SAVE.timer=setTimeout(flushSave,600);return;}
  if(!SAVE.pending)return;
  let payload;
  try{ payload=JSON.stringify(DB); }
  catch(e){ return; }
  if(payload===SAVE.payload){SAVE.pending=false;return;}   // nothing actually changed
  SAVE.inflight=true;
  try{
    if(!window.storage||!window.storage.set)throw new Error("no store in this window");
    await window.storage.set(KEY,payload);
    SAVE.payload=payload;SAVE.pending=false;SAVE.tries=0;
    SAVE.last=Date.now();SAVE.ok=true;SAVE.err="";
  }catch(e){
    SAVE.err=String((e&&e.message)||e);
    SAVE.tries++;
    if(SAVE.tries<=5){                       // 1s, 2s, 4s, 8s, 16s
      clearTimeout(SAVE.timer);
      SAVE.timer=setTimeout(flushSave,1000*Math.pow(2,SAVE.tries-1));
    }else{
      SAVE.ok=false;
    }
  }
  SAVE.inflight=false;
  if(typeof paintSaveState==="function")paintSaveState();
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&SAVE.pending){clearTimeout(SAVE.timer);flushSave();}
});

/* ---------- time formatting ---------- */
function fmt(ms,dec){
  if(ms===null||ms===undefined||!isFinite(ms))return "—";
  dec=dec===undefined?DB.settings.decimals:dec;
  const neg=ms<0; ms=Math.abs(ms);
  const cs=dec===3?ms:Math.floor(ms/10)*10;
  const total=cs/1000, m=Math.floor(total/60), s=total-m*60;
  const ss=s.toFixed(dec===3?3:2);
  const body=m>0?m+":"+(s<10?"0":"")+ss:ss;
  return (neg?"-":"")+body;
}
function fmtClock(ms){
  const s=fmt(ms);const i=s.indexOf(".");
  return i<0?s:`${s.slice(0,i)}<span class="ms">${s.slice(i)}</span>`;
}
function fmtSolve(sv){
  if(!sv)return "—";
  if(sv.penalty==="dnf")return "DNF";
  return fmt(sv.ms+(sv.penalty===2000?2000:0))+(sv.penalty===2000?"+":"");
}
function eff(sv){ // effective ms, Infinity for DNF
  if(!sv)return null;

/* ---------- WCA statistics ---------- */
function avgOf(list,n,trim){ // list newest-last window of n
  if(list.length<n)return null;
  const w=list.slice(-n).map(eff);
  const dnfs=w.filter(v=>v===Infinity).length;
  const cut=trim===undefined?(n>=5?Math.max(1,Math.ceil(n*0.05)):0):trim;
  if(dnfs>cut)return Infinity;
  const sorted=[...w].sort((a,b)=>a-b);
  const kept=cut>0?sorted.slice(cut,sorted.length-cut):sorted;
  if(!kept.length||kept.some(v=>v===Infinity))return Infinity;
  return kept.reduce((a,b)=>a+b,0)/kept.length;
}
function rollingBest(list,n){
  if(list.length<n)return null;
  let best=null;
  for(let i=0;i+n<=list.length;i++){
    const a=avgOf(list.slice(i,i+n),n);
    if(a!==null&&a!==Infinity&&(best===null||a<best))best=a;
  }
  return best;
}
function statsFor(list){
  const done=list.filter(s=>s.penalty!=="dnf");
  const times=done.map(eff);
  const st={n:list.length,ok:done.length,dnf:list.length-done.length};
  st.best=times.length?Math.min(...times):null;
  st.worst=times.length?Math.max(...times):null;
  st.mean=times.length?times.reduce((a,b)=>a+b,0)/times.length:null;
  st.sd=times.length>1?Math.sqrt(times.reduce((a,b)=>a+(b-st.mean)**2,0)/(times.length-1)):null;
  st.mo3=avgOf(list,3,0);              // mean of 3: nothing trimmed, any DNF is a DNF
  st.bo3=(()=>{const w=list.slice(-3).map(eff).filter(v=>v!==Infinity);
    return w.length?Math.min(...w):null;})();
  st.bestMo3=rollingBest3(list);
  st.ao5=avgOf(list,5); st.ao12=avgOf(list,12);
  st.ao50=avgOf(list,50); st.ao100=avgOf(list,100);
  st.bestAo5=rollingBest(list,5); st.bestAo12=rollingBest(list,12);
  st.total=times.reduce((a,b)=>a+b,0);
  return st;
}
function rollingBest3(list){
  if(list.length<3)return null;
  let best=null;
  for(let i=0;i+3<=list.length;i++){
    const a=avgOf(list.slice(i,i+3),3,0);
    if(a!==null&&a!==Infinity&&(best===null||a<best))best=a;
  }
  return best;
}
/* Records span every session of a puzzle. Singles compare across all of them;
   averages are only meaningful inside the session they were set in. */
function recordsFor(puzzle){
  const sess=DB.sessions.filter(s=>s.puzzle===puzzle);
  const out={single:null,mo3:null,ao5:null,ao12:null,ao50:null,ao100:null,count:0,dnf:0};
  const best=(k,v)=>{if(v!==null&&v!==undefined&&v!==Infinity&&(out[k]===null||v<out[k]))out[k]=v;};
  sess.forEach(se=>{
    const list=DB.solves.filter(s=>s.session===se.id);
    if(!list.length)return;
    out.count+=list.length;
    list.forEach(s=>{if(s.penalty==="dnf")out.dnf++;else best("single",eff(s));});
    best("mo3",rollingBest3(list));
    best("ao5",rollingBest(list,5));
    best("ao12",rollingBest(list,12));
    best("ao50",rollingBest(list,50));
    best("ao100",rollingBest(list,100));
  });
  return out;
}
function goalFor(p){const g=DB.settings.goals||{};return g[p===undefined?curPuzzle():p]||0;}
function setGoal(p,v){DB.settings.goals=DB.settings.goals||{};DB.settings.goals[p]=v;}
function isPB(sv,list){
  const e=eff(sv); if(e===Infinity)return false;
  const prev=list.filter(x=>x.id!==sv.id).map(eff).filter(v=>v!==Infinity);
  return prev.length>0 && e<Math.min(...prev);
}

/* ============================================================================
   SCRAMBLES + a small NxN cube engine so the preview shows the real state
   ========================================================================== */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];

function scrambleNxN(n,len){
  const faces=["U","D","L","R","F","B"], axis={U:0,D:0,L:1,R:1,F:2,B:2};
  const maxW=Math.floor(n/2);
  const out=[];let lastF=null,lastAx=null,axCount=0;
  while(out.length<len){
    const f=pick(faces);
    if(f===lastF)continue;
    if(axis[f]===lastAx&&axCount>=2)continue;
    if(axis[f]===lastAx)axCount++;else{axCount=1;lastAx=axis[f];}
    lastF=f;
    let w=1;
    if(maxW>1)w=1+rnd(maxW); // outer or inner slices
    let name=f;
    if(w===2)name=f+"w";
    else if(w>2)name=w+f+"w";
    out.push(name+pick(["","'","2"]));
  }
  return out.join(" ");
}
function scramblePyra(){
  const m=["U","L","R","B"],out=[];let last=null;
  for(let i=0;i<11;i++){let f=pick(m);while(f===last)f=pick(m);last=f;out.push(f+pick(["","'"]));}
  const tips=["u","l","r","b"];
  tips.forEach(tp=>{const r=rnd(3);if(r<2)out.push(tp+(r?"'":""));});
  return out.join(" ");
}
function scrambleSkewb(){
  const m=["U","L","R","B"],out=[];let last=null;
  for(let i=0;i<11;i++){let f=pick(m);while(f===last)f=pick(m);last=f;out.push(f+pick(["","'"]));}
  return out.join(" ");
}
function scrambleMega(){
  const lines=[];
  for(let l=0;l<7;l++){
    const row=[];
    for(let i=0;i<5;i++)row.push("R"+pick(["++","--"]));
    for(let i=0;i<5;i++)row.push("D"+pick(["++","--"]));
    row.push(pick(["U","U'"]));
    lines.push(row.join(" "));
  }
  return lines.join("\n");
}
function scrambleClock(){
  const v=()=>{const n=Math.floor(Math.random()*12)-5;return (n>=0?n+"+":(-n)+"-");};
  const out=[];
  ["UR","DR","DL","UL","U","R","D","L","ALL"].forEach(p=>out.push(p+v()));
  out.push("y2");
  ["U","R","D","L","ALL"].forEach(p=>out.push(p+v()));
  out.push(["UR","DR","DL","UL"].map(()=>Math.random()<.5?"U":"d").join(""));
  return out.join(" ");
}

/* ---- the rest of the shelf ---- */
function scrambleCornerTurner(moves,len){
  const out=[];let last=null;
  for(let i=0;i<len;i++){
    let f=pick(moves);let guard=0;
    while(f===last&&guard++<20)f=pick(moves);
    last=f;out.push(f+pick(["","'"]));
  }
  return out.join(" ");
}
function scrambleMinx(lines,wide){
  const out=[];
  for(let l=0;l<lines;l++){
    const row=[];
    for(let i=0;i<5;i++)row.push((wide?"R":"R")+pick(["++","--"]));
    for(let i=0;i<5;i++)row.push("D"+pick(["++","--"]));
    row.push(pick(["U","U'"]));
    out.push(row.join(" "));
  }
  return out.join("\n");
}
function scrambleCuboid(set,len){
  const out=[];let last=null;
  for(let i=0;i<len;i++){
    let m=pick(set);let guard=0;
    while(m[0]===(last||"")[0]&&guard++<20)m=pick(set);
    last=m;out.push(m);
  }
  return out.join(" ");
}
function scrambleSq2(){
  const out=[];
  for(let i=0;i<14;i++){
    out.push("("+(Math.floor(Math.random()*12)-5)+","+(Math.floor(Math.random()*12)-5)+")");
    if(i<13)out.push("/");
  }
  return out.join(" ");
}
function scrambleMasterPyra(){
  const m=["U","L","R","B"],out=[];let last=null;
  for(let i=0;i<16;i++){
    let f=pick(m);while(f===last)f=pick(m);last=f;
    out.push((Math.random()<.45?f.toLowerCase():f)+pick(["","'"]));
  }
  ["u","l","r","b"].forEach(tp=>{const r=rnd(3);if(r<2)out.push(tp+(r?"'":""));});
  return out.join(" ");
}
function scrambleCustom(){
  const set=String(DB.settings.customMoves||"R U F").trim().split(/[\s,]+/).filter(Boolean);
  if(!set.length)return "—";
  const len=clamp(parseInt(DB.settings.customLen)||20,1,120);
  const out=[];let last=null;
  for(let i=0;i<len;i++){
    let f=pick(set);let guard=0;
    while(f===last&&set.length>1&&guard++<20)f=pick(set);
    last=f;out.push(f+pick(["","'","2"]));
  }
  return out.join(" ");
}

function makeScramble(pid){
  const p=PZ(pid);
  if(p.n>=2)return scrambleNxN(p.n,p.len);
  switch(pid){
    case "pyra":return scramblePyra();
    case "mpyra":return scrambleMasterPyra();
    case "skewb":return scrambleSkewb();
    case "sq1":return scrambleSq1();
    case "sq2":return scrambleSq2();
    case "mega":return scrambleMega();
    case "kilo":return scrambleMinx(5);
    case "giga":return scrambleMinx(10);
    case "pcrystal":return scrambleMinx(7);
    case "clock":return scrambleClock();
    case "redi":return scrambleCornerTurner(["U","R","L","B","F","D"],18);
    case "ivy":return scrambleCornerTurner(["U","R","L","B"],9);
    case "dino":return scrambleCornerTurner(["U","R","L","F","B","D"],14);
    case "332":return scrambleCuboid(["U","U'","U2","D","D'","D2","R2","L2","F2","B2"],18);
    case "223":return scrambleCuboid(["U","U'","U2","D","D'","D2","R2","F2"],16);
    case "331":return scrambleCuboid(["U2","D2","R2","L2","F2","B2"],12);
    case "custom":return scrambleCustom();
    default:return scrambleNxN(3,20);
  }
}

/* ---------- cube engine ---------- */
function newCube(n){
  const c={};["U","R","F","D","L","B"].forEach((f,i)=>{
    c[f]=Array.from({length:n},()=>Array(n).fill(i));});
  c.n=n;return c;
}
function rotFace(m,cw){
  const n=m.length,r=Array.from({length:n},()=>Array(n).fill(0));
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)r[i][j]=cw?m[n-1-j][i]:m[j][n-1-i];
  return r;
}
function turn(c,f,layer,dir){ // dir 1=cw 2=180 3=ccw ; layer 0 = outer
  const q=((dir%4)+4)%4;
  for(let t=0;t<q;t++)single(c,f,layer);
}
function single(c,f,k){
  const n=c.n,U=c.U,D=c.D,L=c.L,R=c.R,F=c.F,B=c.B;
  const col=(m,j)=>m.map(r=>r[j]);
  if(f==="U"){
    const tmp=F[k].slice();
    F[k]=R[k].slice();R[k]=B[k].slice();B[k]=L[k].slice();L[k]=tmp;
    if(k===0)c.U=rotFace(U,true);
  }else if(f==="D"){
    const r=n-1-k,tmp=F[r].slice();
    F[r]=L[r].slice();L[r]=B[r].slice();B[r]=R[r].slice();R[r]=tmp;
    if(k===0)c.D=rotFace(D,true);
  }else if(f==="R"){
    const j=n-1-k,tmp=col(U,j);
    for(let i=0;i<n;i++)U[i][j]=F[i][j];
    for(let i=0;i<n;i++)F[i][j]=D[i][j];
    for(let i=0;i<n;i++)D[i][j]=B[n-1-i][k];
    for(let i=0;i<n;i++)B[i][k]=tmp[n-1-i];
    if(k===0)c.R=rotFace(R,true);
  }else if(f==="L"){
    const j=k,tmp=col(U,j);
    for(let i=0;i<n;i++)U[i][j]=B[n-1-i][n-1-k];
    for(let i=0;i<n;i++)B[n-1-i][n-1-k]=D[i][j];
    for(let i=0;i<n;i++)D[i][j]=F[i][j];
    for(let i=0;i<n;i++)F[i][j]=tmp[i];
    if(k===0)c.L=rotFace(L,true);
  }else if(f==="F"){
    const r=n-1-k,tmp=U[r].slice();
    for(let j=0;j<n;j++)U[r][j]=L[n-1-j][n-1-k];
    for(let i=0;i<n;i++)L[i][n-1-k]=D[k][i];
    for(let j=0;j<n;j++)D[k][j]=R[n-1-j][k];
    for(let i=0;i<n;i++)R[i][k]=tmp[i];
    if(k===0)c.F=rotFace(F,true);
  }else if(f==="B"){
    const r=k,tmp=U[r].slice();
    for(let j=0;j<n;j++)U[r][j]=R[j][n-1-k];
    for(let i=0;i<n;i++)R[i][n-1-k]=D[n-1-k][n-1-i];
    for(let j=0;j<n;j++)D[n-1-k][j]=L[j][k];
    for(let i=0;i<n;i++)L[i][k]=tmp[n-1-i];
    if(k===0)c.B=rotFace(B,true);
  }
}
function applyScramble(n,scr){
  const c=newCube(n);
  scr.split(/\s+/).forEach(tok=>{
    if(!tok)return;
    const m=tok.match(/^(\d*)([UDLRFB])(w?)([2']?)$/);
    if(!m)return;
    const width=m[1]?parseInt(m[1]):(m[3]?2:1);
    const dir=m[4]==="'"?3:m[4]==="2"?2:1;
    for(let k=0;k<width;k++)turn(c,m[2],k,dir);
  });
  return c;
}

const PALETTE={
  normal:["#F7F5F0","#D8493F","#3FA76A","#F2C230","#E08A34","#3E76C8"],
  cb:    ["#FFFFFF","#D2263A","#00A0A0","#F2E14C","#E87722","#2450C8"]
};
function drawNet(cv,cube){
  const n=cube.n, pal=PALETTE[DB.settings.colorblind?"cb":"normal"];
  const cell=n<=3?15:n<=5?11:8, gap=1.4, pad=6;
  const fw=n*cell+(n-1)*gap, bw=4*fw+3*8;
  const W=bw+pad*2, H=3*fw+2*8+pad*2;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";
  const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const pos={U:[fw+8,0],L:[0,fw+8],F:[fw+8,fw+8],R:[2*(fw+8),fw+8],B:[3*(fw+8),fw+8],D:[fw+8,2*(fw+8)]};
  for(const f in pos){
    const [ox,oy]=pos[f];
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){
      const x=pad+ox+j*(cell+gap), y=pad+oy+i*(cell+gap);
      g.fillStyle=pal[cube[f][i][j]];
      g.beginPath();g.roundRect(x,y,cell,cell,Math.max(1.5,cell*0.18));g.fill();
      g.strokeStyle="rgba(0,0,0,.35)";g.lineWidth=.7;g.stroke();
    }
  }
}

/* ============================================================================
   THE TIMER — WCA-style hold-to-arm, optional 15s inspection
   ========================================================================== */
const T={state:"idle",holdAt:0,startAt:0,inspAt:0,raf:0,lock:false,last:null,pressed:false,memo:null};
let scramble="", scrambleCube=null, scrHistory=[];

function setClock(html,cls){
  const c=$("#clock");c.innerHTML=html;
  c.className=cls||"";
  const gh=$("#clockGhost");
  if(gh)gh.innerHTML=c.innerHTML.replace(/[0-9]/g,"8");
  const wrap=$("#clockWrap");
  if(wrap)wrap.className=(cls==="ready"?"armed":cls==="run"?"run":"");
}
function renderHud(){
  const st=$("#hudState"),pz=$("#hudPuzzle"),ct=$("#hudCount");
  if(!st)return;
  const state=T.state==="running"?t("hudRun"):T.state==="inspecting"?t("hudInsp")
    :T.armed?t("hudArmed"):t("hudIdle");
  st.textContent=state;
  st.className=(T.state==="running"||T.armed)?"live":"";
  pz.textContent=pzName(PZ(curPuzzle()));
  const n=curSolves().length;
  ct.textContent=n+" "+t("solves");
}
function showTime(ms){setClock(fmtClock(ms),T.state==="running"?"run":"");}

function newScramble(keep){
  if(!keep&&scramble){scrHistory.push(scramble);if(scrHistory.length>40)scrHistory.shift();}
  scramble=keep||makeScramble(curPuzzle());
  const sb=$("#scrambleBar");
  if(sb){sb.classList.remove("fresh");void sb.offsetWidth;sb.classList.add("fresh");}
  const bar=$("#scrambleBar");bar.innerHTML="";
  scramble.split("\n").forEach((line,i)=>{
    const row=el("div");
    line.split(" ").forEach((m,i)=>{
      if(i)row.append(document.createTextNode(" "));
      row.append(el("span",{class:"mv"},m));
    });
    bar.append(row);
  });
  drawPreview(curPuzzle(),scramble);
  $("#scrambleMeta").textContent=t("scrambleTap");
}

function tick(){
  if(T.state==="running"){
    const ms=performance.now()-T.startAt;
    setClock(fmtClock(ms),"run");
  }else if(T.state==="inspecting"){
    const s=(performance.now()-T.inspAt)/1000;
    let left=Math.ceil(15-s);
    let txt=left>0?String(left):(s<17?"+2":"DNF");
    setClock(txt,T.armed?"ready":T.pressed?"hold":"insp");
    if(!T.cue8&&s>=8){T.cue8=1;cue(660);}
    if(!T.cue12&&s>=12){T.cue12=1;cue(560);}
    if(s>=17+0.9){cancelInspection(true);return;}
  }
  T.raf=requestAnimationFrame(tick);
}
function cancelInspection(dnf){
  T.state="idle";cancelAnimationFrame(T.raf);
  if(dnf){finish(0,"dnf");}
  else setClock(fmtClock(0),"");
}

function armDown(){
  if(T.lock)return;
  if(T.state==="running"){stopSolve();return;}
  if(T.state==="idle"||T.state==="inspecting"){
    T.holdAt=performance.now();
    T.pressed=true;
    if(T.state==="idle"&&DB.settings.inspection){T.wantInspect=true;}
    setClock(T.state==="inspecting"?$("#clock").textContent:fmtClock(0),"hold");
    T.holdTimer=setTimeout(()=>{
      if(T.pressed){T.armed=true;renderHud();
        const c=$("#clock");c.className="ready";
        if(T.state!=="inspecting")c.innerHTML=fmtClock(0);
        cue(880,0.05,0.03);}
    },DB.settings.holdMs);
  }
}
function armUp(){
  if(!T.pressed)return;
  T.pressed=false;clearTimeout(T.holdTimer);
  setTimeout(renderHud,0);
  if(T.state==="inspecting"){
    if(T.armed){T.armed=false;startSolve();}
    else setClock($("#clock").textContent,"insp");
    return;
  }
  if(T.state!=="idle")return;
  if(T.armed){T.armed=false;
    if(DB.settings.inspection&&T.wantInspect){startInspection();}
    else startSolve();
  }else{
    if(DB.settings.inspection&&T.wantInspect){startInspection();}
    else setClock(fmtClock(0),"");
  }
  T.wantInspect=false;
}
function startInspection(){
  T.state="inspecting";T.inspAt=performance.now();T.cue8=0;T.cue12=0;
  cue(520,0.07,0.04);
  cancelAnimationFrame(T.raf);tick();
  renderHud();
  $("#scrambleMeta").textContent=t("inspecting");
}
function startSolve(){
  T.state="running";T.startAt=performance.now();T.memo=null;
  document.body.classList.toggle("solving",DB.settings.autoZen);
  $("#solveTools").innerHTML="";
  cue(760,0.06,0.035);
  renderHud();
  cancelAnimationFrame(T.raf);tick();
}
function stopSolve(){
  const ms=performance.now()-T.startAt;
  T.state="idle";cancelAnimationFrame(T.raf);
  document.body.classList.remove("solving");
  const ck=$("#clock");ck.classList.remove("land");void ck.offsetWidth;ck.classList.add("land");
  renderHud();
  T.lock=true;setTimeout(()=>T.lock=false,320);
  cue(430,0.11,0.05);
  finish(ms,0);
}
function finish(ms,penalty){
  const sv={id:uid(),session:curSessionId(),puzzle:curPuzzle(),ms:Math.round(ms),
    penalty:penalty||0,scramble,cube:DB.settings.cube||null,note:"",tags:[],ts:Date.now(),
    memo:(T.memo!==null&&T.memo!==undefined&&ms>0)?Math.round(T.memo):null};
  DB.solves.push(sv);T.last=sv;touchDay();save();
  setClock(fmtClock(eff(sv)===Infinity?ms:eff(sv)),"");
  if(penalty==="dnf")setClock("DNF","");
  renderStats();renderList();renderTools();renderHud();
  const list=curSolves();
  const pb=isPB(sv,list);
  if(pb){celebrate();speak("pb",sv);}
  else speak(contextFor(sv,list),sv);
  newScramble();
  checkRest();
}
function renderTools(){
  const box=$("#solveTools");box.innerHTML="";
  if(!T.last||!DB.solves.find(s=>s.id===T.last.id)){return;}
  const sv=T.last;
  const mk=(label,active,fn,cls)=>el("button",{class:"pillbtn"+(active?" active":"")+(cls?" "+cls:""),onclick:fn},label);
  box.append(
    mk(t("ok"),sv.penalty===0,()=>{sv.penalty=0;after();}),
    mk(t("plus2"),sv.penalty===2000,()=>{sv.penalty=2000;after();}),
    mk(t("dnf"),sv.penalty==="dnf",()=>{sv.penalty="dnf";after();}),
    mk(t("note"),false,()=>openSolve(sv.id)),
    mk(t("deleteLast"),false,()=>{DB.solves=DB.solves.filter(s=>s.id!==sv.id);T.last=null;
      save();renderStats();renderList();renderTools();setClock(fmtClock(0),"");},"danger")
  );
  function after(){save();setClock(sv.penalty==="dnf"?"DNF":fmtClock(eff(sv)),"");
    renderStats();renderList();renderTools();}
}

/* ---------- input ---------- */
function keyIsStart(e){
  return DB.settings.startKey==="space"?e.code==="Space":true;
}
document.addEventListener("keydown",e=>{
  if(e.repeat)return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select")return;
  if($$(".scrim.open").length){
    if(e.key==="Escape")closeAll();
    return;
  }
  if(T.state==="running"){
    e.preventDefault();
    if(PZ(curPuzzle()).bld&&T.memo===null&&e.code!=="Space"){
      T.memo=performance.now()-T.startAt;cue(700,.06,.03);
      $("#scrambleMeta").textContent=t("memo")+" "+fmt(T.memo);
      return;
    }
    stopSolve();return;
  }
  if(keyIsStart(e)){e.preventDefault();armDown();return;}
  const k=e.key.toLowerCase();
  if(k==="n"){newScramble();}
  else if(k==="d"&&T.last){DB.solves=DB.solves.filter(s=>s.id!==T.last.id);T.last=null;save();
    renderStats();renderList();renderTools();}
  else if(k==="z"){toggleZen();}
  else if(k==="t"){openManual();}
  else if(k==="escape"){if(T.state==="inspecting")cancelInspection(false);document.body.classList.remove("zen");}
  else if(k==="1"&&T.last){T.last.penalty=0;save();renderStats();renderList();renderTools();}
  else if(k==="2"&&T.last){T.last.penalty=2000;save();renderStats();renderList();renderTools();}
  else if(k==="3"&&T.last){T.last.penalty="dnf";save();renderStats();renderList();renderTools();}
});
document.addEventListener("keyup",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select")return;
  if(keyIsStart(e)){e.preventDefault();armUp();}
});
(function touch(){
  const stage=$("#stage");
  const isUI=t=>t.closest("button,select,input,textarea,#scrambleBar,#selectors,.panel");
  let downAt=null;
  stage.addEventListener("pointerdown",e=>{
    if(isUI(e.target)&&T.state!=="running")return;
    e.preventDefault();
    if(T.state==="running"){stopSolve();return;}
    downAt={x:e.clientX,y:e.clientY};
    armDown();
  });
  window.addEventListener("pointermove",e=>{
    if(!downAt||!T.pressed)return;
    if(Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>12){
      /* she is scrolling, not steadying her hands */
      downAt=null;T.pressed=false;T.armed=false;clearTimeout(T.holdTimer);
      if(T.state!=="running"&&T.state!=="inspecting"){
        setClock(T.last?(T.last.penalty==="dnf"?"DNF":fmtClock(eff(T.last))):fmtClock(0),"");
        renderHud();
      }
    }
  });
  window.addEventListener("pointerup",()=>{downAt=null;if(T.pressed)armUp();});
  window.addEventListener("pointercancel",()=>{downAt=null;T.pressed=false;T.armed=false;clearTimeout(T.holdTimer);});
})();

function renderGoal(st){
  const box=$("#goalRing");box.innerHTML="";
  const goal=DB.settings.goalSec*1000;
  if(!goal||!st.best){box.classList.add("hidden");return;}
  box.classList.remove("hidden");
  const list=curSolves().map(eff).filter(v=>v!==Infinity);
  const under=list.filter(v=>v<=goal).length;
  const pct=clamp(Math.round(under/Math.max(1,list.length)*100),0,100);
  const R=26,C=2*Math.PI*R;
  const svg=`<svg width="66" height="66" viewBox="0 0 66 66">
    <circle cx="33" cy="33" r="${R}" fill="none" stroke="var(--edge)" stroke-width="4"/>
    <circle cx="33" cy="33" r="${R}" fill="none" stroke="var(--gold)" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"
      transform="rotate(-90 33 33)"/>
    <text x="33" y="37" text-anchor="middle" font-size="15" fill="var(--text)"
      font-family="var(--f-ui)">${pct}%</text></svg>`;
  box.insertAdjacentHTML("beforeend",svg);
  box.append(el("div",null,
    el("b",null,t("goal")+" "+fmt(goal)),
    el("small",null,under+" / "+list.length+" "+t("solvesUnder").toLowerCase())));
}
let listLimit=100,listFor="",searchQ="";
function matchesFilter(sv,bestV){
  const f=DB.settings.listFilter||"all";
  if(f==="pb"&&eff(sv)!==bestV)return false;
  if(f==="plus2"&&sv.penalty!==2000)return false;
  if(f==="dnf"&&sv.penalty!=="dnf")return false;
  if(f==="noted"&&!(sv.note||(sv.tags||[]).length))return false;
  if(searchQ){
    const q=searchQ.toLowerCase();
    const hay=((sv.note||"")+" "+(sv.tags||[]).join(" ")+" "+(sv.scramble||"")+" "+fmtSolve(sv)).toLowerCase();
    if(hay.indexOf(q)<0)return false;
  }
  return true;
}
function renderFilterBar(){
  const box=$("#solveFilter");if(!box)return;
  box.innerHTML="";
  const inp=el("input",{class:"lux",placeholder:t("search"),style:"width:100%;font-size:12.5px"});
  inp.value=searchQ;
  inp.addEventListener("input",()=>{searchQ=inp.value;listLimit=100;renderList();});
  box.append(inp);
  const chipRow=el("div",{class:"chipset",style:"margin-top:8px"});
  [["all",t("fAll")],["pb",t("fPB")],["plus2",t("fPlus")],["dnf",t("fDnf")],["noted",t("fNoted")]]
    .forEach(([k,lab])=>{
      chipRow.append(el("button",{class:"chip"+((DB.settings.listFilter||"all")===k?" on":""),onclick:()=>{
        DB.settings.listFilter=k;save();listLimit=100;renderFilterBar();renderList();}},lab));
    });
  box.append(chipRow);
}
function renderList(){
  const box=$("#solveList");box.innerHTML="";
  const list=curSolves();
  if(listFor!==curSessionId()){listFor=curSessionId();listLimit=100;}
  if(!list.length){
    box.append(el("div",{class:"emptystate"},
      el("b",null,t("emptyTitle")),t("emptyBody")));
    return;
  }
  // one pass for the rolling Ao5 beside each row, and for the session best
  let bestV=Infinity;
  const a5s=new Array(list.length);
  for(let k=0;k<list.length;k++){
    const e=eff(list[k]);
    if(e!==Infinity&&e<bestV)bestV=e;
    a5s[k]=k>=4?avgOf(list.slice(k-4,k+1),5):null;
  }
  const cubeName={};DB.cubes.forEach(c=>cubeName[c.id]=c.name);
  const view=list.filter(sv=>matchesFilter(sv,bestV));
  if(!view.length){
    box.append(el("div",{class:"emptystate"},el("b",null,t("noneYet")),""));
    return;
  }
  const frag=document.createDocumentFragment();
  const idxOf=new Map();list.forEach((sv,i)=>idxOf.set(sv,i));
  const stop=Math.max(0,view.length-listLimit);
  for(let vi=view.length-1;vi>=stop;vi--){
    const sv=view[vi],k=idxOf.get(sv),e=eff(sv),a5=a5s[k],sub=[];
    if(sv.memo)sub.push(t("memo")+" "+fmt(sv.memo));
    if(sv.cube&&cubeName[sv.cube])sub.push(cubeName[sv.cube]);
    if(a5)sub.push("Ao5 "+(a5===Infinity?"DNF":fmt(a5)));
    if(sv.note)sub.push("\u270E");
    frag.append(el("div",{class:"solverow"+(e===bestV&&e!==Infinity?" pb":"")+(sv.penalty==="dnf"?" dnf":""),
      onclick:()=>openSolve(sv.id)},
      el("div",{class:"idx"},k+1),
      el("div",null,
        el("div",{class:"tm"},fmtSolve(sv)),
        el("div",{class:"sub"},sub.join(" \u00B7 "))),
      el("div",{class:"tag"},new Date(sv.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}))
    ));
  }
  box.append(frag);
  if(stop>0)box.append(el("button",{class:"pillbtn",style:"width:100%;margin-top:10px",
    onclick:()=>{listLimit+=200;renderList();}},t("showMore")+" ("+stop+")"));
}

let recent=[],toastTimer=null;

function contextFor(sv,list){
  if(sv.penalty==="dnf")return "dnf";
  if(list.length===1)return "first";
  const h=new Date().getHours();
  const done=list.filter(s=>s.penalty!=="dnf").map(eff);
  const mean=done.length?done.reduce((a,b)=>a+b,0)/done.length:null;
  const e=eff(sv);
  if(list.length>=24){
    const a=avgOf(list.slice(-12),12),bp=avgOf(list.slice(-24,-12),12);
    if(a&&bp&&a!==Infinity&&bp!==Infinity&&Math.abs(a-bp)/bp<0.012&&Math.random()<0.5)return "flat";
  }
  if(list.length%25===0)return "many";
  if(h>=23||h<4)return Math.random()<0.5?"late":"any";
  if(mean&&e<mean*0.93)return "fast";
  if(mean&&e>mean*1.14)return "slow";
  if(Date.now()-(DB.settings.lastSeen||0)>1000*60*60*20)return "back";
  return "any";
}
function enabledTones(){
  const s=DB.settings.tones,out=[];
  ["tender","radiant","fierce","mystic","companion"].forEach(k=>{if(s[k])out.push(k);});
  return out;
}
function pickMessage(ctx){
  const bank=MSGS[DB.settings.lang]||MSGS.en;
  let pool=[];
  enabledTones().forEach(tone=>{
    (bank[tone]||[]).forEach(m=>pool.push({tone,c:m.c,m:m.m}));
  });
  if(DB.settings.tones.mine){
    (DB.settings.custom[DB.settings.lang]||[]).forEach(m=>pool.push({tone:"mine",c:"any",m}));
  }
  if(!pool.length)return null;
  const exact=pool.filter(x=>x.c===ctx);
  let use=(exact.length&&(ctx!=="any")&&Math.random()<0.78)?exact:pool.filter(x=>x.c==="any"||x.c===ctx);
  if(!use.length)use=pool;
  const fresh=use.filter(x=>!recent.includes(x.m));
  const arr=fresh.length?fresh:use;
  const chosen=arr[Math.floor(Math.random()*arr.length)];
  recent.push(chosen.m);if(recent.length>10)recent.shift();
  return chosen;
}

function runBreath(orb,count,getPat){
  let phase=0,cycles=0;
  const step=()=>{
    const p=getPat(),labels=[t("breatheIn"),t("breatheHold"),t("breatheOut"),t("breatheHold")];
    while(p[phase]===0)phase=(phase+1)%4;
    const secs=p[phase];
    orb.className=phase===0?"in":phase===2?"out":orb.className.replace(/ ?$/,"");
    orb.style.transitionDuration=secs+"s";
    orb.querySelector("span").textContent=labels[phase];
    let left=secs;count.textContent=left;
    clearInterval(breathTimer.i);
    breathTimer.i=setInterval(()=>{left--;count.textContent=Math.max(0,left);},1000);
    breathTimer.t=setTimeout(()=>{
      phase=(phase+1)%4;if(phase===0)cycles++;
      if(cycles>=12){stopBreath(orb);return;}
      step();

/* ============================================================================
   INSIGHTS — charts drawn by hand so they match the room they live in
   ========================================================================== */
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function chartCanvas(h){
  const c=el("canvas",{class:"chart"});c.style.height=h+"px";return c;
}
function prep(cv,h){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=cv.clientWidth||600;
  cv.width=w*dpr;cv.height=h*dpr;
  const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  return {g,w,h};
}
function lineChart(cv,list){
  const {g,w,h}=prep(cv,220);
  const pts=list.map(eff).map(v=>v===Infinity?null:v);
  const vals=pts.filter(v=>v!==null);
  if(vals.length<2){emptyChart(g,w,h);return;}
  const lo=Math.min(...vals)*0.94,hi=Math.max(...vals)*1.04;
  const P={l:44,r:10,t:12,b:18};
  const X=i=>P.l+(w-P.l-P.r)*(pts.length<2?0:i/(pts.length-1));
  const Y=v=>h-P.b-(h-P.t-P.b)*((v-lo)/(hi-lo||1));
  g.strokeStyle="rgba(255,255,255,.07)";g.lineWidth=1;
  g.font="10px Inter, system-ui, sans-serif";g.fillStyle=css("--text-dim");g.textAlign="right";
  for(let k=0;k<=4;k++){
    const v=lo+(hi-lo)*k/4,y=Y(v);
    g.beginPath();g.moveTo(P.l,y);g.lineTo(w-P.r,y);g.stroke();
    g.fillText(fmt(v,2),P.l-6,y+3);
  }
  // ao5 / ao12 ribbons
  const drawAvg=(n,color,width)=>{
    g.strokeStyle=color;g.lineWidth=width;g.beginPath();let started=false;
    for(let i=n-1;i<list.length;i++){
      const a=avgOf(list.slice(0,i+1),n);
      if(a===null||a===Infinity){started=false;continue;}
      const x=X(i),y=Y(a);
      if(!started){g.moveTo(x,y);started=true;}else g.lineTo(x,y);
    }
    g.stroke();
  };
  // scatter of singles
  pts.forEach((v,i)=>{
    if(v===null){g.fillStyle=css("--bad");g.fillRect(X(i)-1.5,h-P.b-4,3,4);return;}
    g.fillStyle="rgba(255,255,255,.30)";
    g.beginPath();g.arc(X(i),Y(v),1.9,0,7);g.fill();
  });
  drawAvg(5,css("--gold"),1.8);
  drawAvg(12,css("--rose"),1.2);
  g.textAlign="left";g.fillStyle=css("--gold");g.fillText("Ao5",P.l+2,P.t+2);
  g.fillStyle=css("--rose");g.fillText("Ao12",P.l+30,P.t+2);
}
function histChart(cv,list){
  const {g,w,h}=prep(cv,170);
  const vals=list.map(eff).filter(v=>v!==Infinity);
  if(vals.length<5){emptyChart(g,w,h);return;}
  const lo=Math.min(...vals),hi=Math.max(...vals);
  const bins=Math.min(18,Math.max(6,Math.round(Math.sqrt(vals.length))));
  const step=(hi-lo)/bins||1,counts=Array(bins).fill(0);
  vals.forEach(v=>counts[Math.min(bins-1,Math.floor((v-lo)/step))]++);
  const mx=Math.max(...counts),P={l:8,r:8,t:10,b:22},bw=(w-P.l-P.r)/bins;
  counts.forEach((c,i)=>{
    const bh=(h-P.t-P.b)*(c/mx);
    const grd=g.createLinearGradient(0,h-P.b-bh,0,h-P.b);
    grd.addColorStop(0,css("--gold"));grd.addColorStop(1,"rgba(233,201,127,.08)");
    g.fillStyle=grd;
    g.beginPath();g.roundRect(P.l+i*bw+1.5,h-P.b-bh,bw-3,bh,3);g.fill();
  });
  g.fillStyle=css("--text-dim");g.font="10px Inter, system-ui, sans-serif";
  g.textAlign="left";g.fillText(fmt(lo,2),P.l,h-6);
  g.textAlign="right";g.fillText(fmt(hi,2),w-P.r,h-6);
}
function hourChart(cv,solves){
  const {g,w,h}=prep(cv,150);
  const sums=Array(24).fill(0),ns=Array(24).fill(0);
  solves.forEach(s=>{if(s.penalty==="dnf")return;const hh=new Date(s.ts).getHours();
    sums[hh]+=eff(s);ns[hh]++;});
  const avgs=sums.map((s,i)=>ns[i]?s/ns[i]:null);
  const got=avgs.filter(v=>v!==null);
  if(got.length<2){emptyChart(g,w,h);return;}
  const lo=Math.min(...got)*0.97,hi=Math.max(...got)*1.03;
  const P={l:8,r:8,t:10,b:20},bw=(w-P.l-P.r)/24;
  avgs.forEach((v,i)=>{
    if(v===null)return;
    const bh=(h-P.t-P.b)*(1-(v-lo)/(hi-lo||1))+6;
    g.fillStyle=v===Math.min(...got)?css("--gold"):"rgba(255,255,255,.18)";
    g.beginPath();g.roundRect(P.l+i*bw+1,h-P.b-bh,bw-2,bh,3);g.fill();
  });
  g.fillStyle=css("--text-dim");g.font="10px Inter, system-ui, sans-serif";g.textAlign="center";
  [0,6,12,18,23].forEach(hh=>g.fillText(hh+":00",P.l+hh*bw+bw/2,h-5));
}

  g.fillText(t("needMore"),w/2,h/2);

function openInsights(){
  $("#inTitle").textContent=t("insightsTitle");
  const b=$("#inBody");b.innerHTML="";

  head.append(cell(st.best?fmt(st.best):"—",t("best"),true),

    cell(st.total?fmtDur(st.total):"—",t("totalTime")));

      const d=(p-a)/1000;
      say.push(Math.abs(d)<0.15?t("trendSame"):d>0?t("trendBetter",{d:d.toFixed(2)}):t("trendWorse",{d:Math.abs(d).toFixed(2)}));
    }
  }
  if(st.sd&&st.mean){
    const cv2=st.sd/st.mean;
    say.push(t("consistency")+": "+(cv2<0.11?t("consistencyHigh"):cv2<0.20?t("consistencyMid"):t("consistencyLow")));
  }
  if(all.length>=30){
    const sums={},ns={};
    all.forEach(s=>{if(s.penalty==="dnf")return;const hh=new Date(s.ts).getHours();
      sums[hh]=(sums[hh]||0)+eff(s);ns[hh]=(ns[hh]||0)+1;});
    let bh=null,bv=Infinity;
    for(const hh in ns)if(ns[hh]>=5){const v=sums[hh]/ns[hh];if(v<bv){bv=v;bh=hh;}}
    if(bh!==null)say.push(t("bestHour",{h:bh+":00"}));
  }
  const mi=moodInsight();if(mi)say.push(mi);
  if(say.length){
    const ul=el("div",{style:"margin-bottom:18px"});
    say.forEach(s=>ul.append(el("p",{style:"font-family:var(--f-display);font-size:17px;line-height:1.55;margin:0 0 8px"},s)));
    b.append(ul);
  }

  b.append(el("h4",{class:"sec"},t("chartTimes")));
  const c1=chartCanvas(220);b.append(c1);
  b.append(el("h4",{class:"sec"},t("chartDist")));
  const c2=chartCanvas(170);b.append(c2);
  b.append(el("h4",{class:"sec"},t("chartHour")));
  const c3=chartCanvas(150);b.append(c3);

  // per-cube breakdown
  if(DB.cubes.length){
    b.append(el("h4",{class:"sec"},t("cubes")));
    DB.cubes.forEach(c=>{
      const sv=all.filter(s=>s.cube===c.id);if(!sv.length)return;
      const s2=statsFor(sv);
      b.append(el("div",{class:"statline"},el("span",null,c.name),
        el("b",null,sv.length+" · "+(s2.best?fmt(s2.best):"—")+" · "+(s2.mean?fmt(s2.mean):"—"))));
    });
  }
  openM("#mInsight");
  requestAnimationFrame(()=>{lineChart(c1,list);histChart(c2,list);hourChart(c3,all);});
}
