/* ---------- build the timeline (per bar event lists) ---------- */
function buildSong(S){
  const bars=[];
  let barNo=0;
  S.form.forEach(function(sec){
    const prog=S.prog[sec.p], th=sec.mel?S.themes[sec.mel]:null;
    const lvl=sec.lvl===undefined?1:sec.lvl;
    let mel=[];
    if(th){
      let b=0;
      th.notes.forEach(function(n){
        if(n[0]!==null)mel.push({b:b,dur:n[1],midi:degMidi(th.base,th.scale,n[0]),deg:n[0]});
        b+=n[1];
      });
    }
    for(let i=0;i<sec.bars;i++){
      const ci=(sec.slice?sec.slice[0]+i:i)%prog.length;
      const chord=prog[ci], root=chord[0], type=chord[1];
      const bass=chord[2]!==undefined?chord[2]:root;
      const next=prog[(ci+1)%prog.length];
      const ev=[];
      const rnd=mulberry32(9001+barNo*131+sec.bars);
      /* a phrase breathes: quiet at the edges, fuller in the middle */
      const pos=sec.bars>1?i/(sec.bars-1):0;
      const dyn=lvl*(0.84+0.30*Math.sin(Math.PI*pos));
      const tones=CH[type].map(function(x){return root+x;});
      accomp(ev,tones,root,sec.tex,i,sec,rnd,dyn,next[0],bass);
      if(th){
        const inBar=mel.filter(function(n){return n.b>=i*4&&n.b<i*4+4;});
        inBar.forEach(function(n,k){
          const t0=n.b-i*4;
          /* accent the downbeat, lean off the weak beats */
          const metric=t0===0?1.12:(t0%1===0?1.0:0.88);
          const v=dyn*metric;
          const last=(i===sec.bars-1&&k===inBar.length-1);
          if(sec.flute){
            ev.push({t:t0,midi:n.midi,dur:n.dur,v:.52*v,voice:"flute"});
            /* a grace note leaning into the final note of a phrase */
            if(last&&n.dur>=2)ev.push({t:Math.max(0,t0-0.18),midi:n.midi-1,dur:.18,v:.30*v,voice:"flute"});
          }
          if(sec.flute&&sec.oct)ev.push({t:t0,midi:n.midi-12,dur:Math.min(n.dur,2),v:.20*v,voice:"piano"});
          if(sec.piano){
            ev.push({t:t0,midi:n.midi+12,dur:n.dur,v:.54*v,voice:"piano"});
            if(sec.oct)ev.push({t:t0,midi:n.midi,dur:n.dur,v:.28*v,voice:"piano"});
            if(last&&n.dur>=2){
              ev.push({t:Math.max(0,t0-0.14),midi:n.midi+11,dur:.14,v:.26*v,voice:"piano"});
            }
          }
        });
      }
      if(sec.pad)ev.push({t:0,midi:root-12,dur:4,v:.13*dyn,voice:"pad"});
      /* an inner voice, moving against the tune rather than under it */
      if(sec.counter){
        const cv=(tones[1]!==undefined?tones[1]:tones[0]);
        ev.push({t:1.5,midi:cv,dur:2.2,v:.115*dyn,voice:"piano"});
        ev.push({t:3.0,midi:(tones[2]!==undefined?tones[2]:tones[0]),dur:1.0,v:.09*dyn,voice:"piano"});
      }
      if(sec.swing){
        /* triplet feel: the second eighth of each beat arrives late */
        ev.forEach(function(n){
          const frac=n.t-Math.floor(n.t);
          if(Math.abs(frac-0.5)<0.02)n.t=Math.floor(n.t)+0.6667;
          else if(Math.abs(frac-0.25)<0.02)n.t=Math.floor(n.t)+0.3333;
        });
      }
      bars.push({ev:ev,tmul:sec.rit?(1+0.12*(i+1)):1});
      barNo++;
    }
  });
  return {bars:bars,bpm:S.bpm};
}
/* accompaniment. `rnd` is seeded per bar, so a repeat is never identical
   but is always the same on the next loop — variation, not noise.        */
function accomp(ev,tones,root,tex,barIdx,sec,rnd,dyn,nextRoot,bass){
  if(bass===undefined)bass=root;
  const P=function(t,midi,dur,v){
    while(midi<28)midi+=12;              // a real piano stops at A0
    ev.push({t:t,midi:midi,dur:dur,v:v*dyn,voice:"piano"});
  };
  const up=function(i){return tones[i%tones.length]+12*Math.floor(i/tones.length);};
  const approach=function(){                 // step into the next chord
    const d=nextRoot-bass;
    return bass+(d>0?(d>3?2:1):(d<-3?-2:-1));
  };
  if(tex==="sparse"){
    P(0,root-12,3.6,.30);P(0,root+7,3.4,.14);
    P(2,up(1),1.8,.16);
    if(rnd()<.6)P(3,up(2),1,.13);
    if(rnd()<.3)P(3.5,up(3),.5,.10);
  }else if(tex==="arp"){
    P(0,root-12,2,.32);P(2,root-5,2,.22);
    const patt=rnd()<.5?[0,1,2,3,2,1,2,3]:[0,2,1,3,2,1,3,2];
    patt.forEach(function(k,i){
      if(i===5&&rnd()<.25)return;            // let a hole open occasionally
      P(i*.5,up(k),.7,.14+(i%4===0?.07:0));
    });
    if(rnd()<.3)P(3.75,approach()-12,.25,.16);
  }else if(tex==="block"){
    P(0,root-12,3.8,.30);
    tones.forEach(function(n,i){P(0,n+12,3.6,.15-i*.012);});
    tones.forEach(function(n,i){P(2.5,n+12,1.4,.10);});
    if(rnd()<.5)P(3.5,up(3),.5,.09);
  }else if(tex==="wave"){
    P(0,root-12,2,.34);P(2,root-5,2,.24);
    const skip=Math.floor(rnd()*16);
    for(let i=0;i<16;i++){
      if(i===skip)continue;
      P(i*.25,up(i%6),.45,.085+(i%4===0?.05:0));
    }
  }else if(tex==="still"){
    /* wide, slow, pedalled: the sound of a room with the lamps low */
    P(0,bass-24,4,.26);P(0,bass-12,4,.20);
    tones.forEach(function(n,i){P(0.5,n,3.4,.105-i*.012);});
    if(rnd()<.5)P(2.5,(tones[2]||tones[0])+12,1.4,.075);
  }else if(tex==="flow"){
    /* a rolling left hand across an octave and a half, the way a nocturne moves */
    P(0,bass-24,1.9,.28);
    const shape=[0,2,1,3,2,1,2,3];
    shape.forEach(function(k,i){
      const n=tones[k%tones.length]-12+12*Math.floor(k/tones.length);
      P(i*.5,n,.85,.10+(i===0?.05:0)-(i%2?.02:0));
    });
    P(2,bass-17,1.9,.17);
    if(rnd()<.35)P(3.5,approach()-12,.5,.11);
  }else if(tex==="hymn"){
    /* four voices, moving as little as they have to */
    P(0,bass-24,3.7,.28);
    tones.forEach(function(n,i){P(0,n,1.9,.115-i*.014);});
    tones.forEach(function(n,i){P(2,n+(i===0?12:0),1.9,.10-i*.012);});
    if(rnd()<.45)P(3.5,(tones[1]||tones[0])+12,.5,.085);
  }else if(tex==="swell"){
    /* the climax: sixteenths under the flute, and the bass in octaves */
    P(0,bass-24,2,.32);P(0,bass-12,2,.22);
    P(2,bass-19,2,.28);P(2,bass-7,2,.19);
    for(let i=0;i<16;i++){
      const k=[0,1,2,3,4,3,2,1][i%8];
      const n=(tones[k%tones.length]||tones[0])+12*Math.floor(k/tones.length);
      P(i*.25,n,.4,.075+(i%4===0?.045:0));
    }
  }else if(tex==="comp"){
    /* left hand keeps a rootless shell, right hand answers off the beat */
    P(0,root-12,1.6,.30);
    const shell=[tones[0]+12,(tones[2]||tones[0])+12,(tones[3]||tones[1])+12];
    const hits=rnd()<.5?[0.5,1.5,2.5]:[0.5,1.75,3.0];
    hits.forEach(function(t,i){shell.forEach(function(n,k){P(t,n,.55,.115-k*.012);});});
    P(2,approach()-12,1.2,.22);
    if(rnd()<.4)P(3.5,tones[1]+12,.4,.09);
  }else if(tex==="swing"){
    /* a walking bass: root, an inner tone, the fifth, then a chromatic step */
    const walk=[root-12,(tones[1]||root)-12,(tones[2]||root)-12,approach()-12];
    walk.forEach(function(n,i){P(i,n,.92,.28-(i===0?0:.05));});
    const shell=[(tones[1]||tones[0])+12,(tones[3]||tones[2]||tones[0])+12];
    const hits=rnd()<.5?[1.5,3.0]:[0.5,2.5];
    hits.forEach(function(t){shell.forEach(function(n,k){P(t,n,.6,.115-k*.02);});});
    if(rnd()<.35)P(3.5,(tones[4]||tones[0])+12,.4,.09);
  }else if(tex==="march"){
    /* left hand walks, right hand answers off the beat */
    P(0,root-24,.85,.34);P(0,root-12,.85,.26);
    P(2,root-19,.85,.28);P(2,root-7,.85,.20);
    tones.forEach(function(n,i){P(1,n,.42,.15-i*.01);P(3,n,.42,.13-i*.01);});
    if(barIdx%4===3){                        // a bar-end kick into the next phrase
      P(3.5,approach()-12,.4,.22);
      if(rnd()<.5)P(3.75,root-12,.25,.18);
    }
    if(rnd()<.35)P(1.5,up(3),.3,.09);
  }else if(tex==="marchFull"){
    P(0,root-24,.9,.40);P(0,root-12,.9,.32);P(0,root-5,.9,.18);
    P(2,root-19,.9,.32);P(2,root-7,.9,.22);
    tones.forEach(function(n,i){
      P(1,n,.45,.17-i*.01);P(1,n+12,.45,.10-i*.01);
      P(3,n,.45,.15-i*.01);
    });
    if(barIdx%4===3){
      P(3.33,approach()-12,.3,.24);P(3.66,root-12,.34,.22);
    }else if(rnd()<.4){
      P(3.5,up(2),.4,.12);
    }
  }else if(tex==="fanfare"){
    P(0,root-24,.5,.42);P(0,root-12,.5,.34);
    P(.75,root-12,.25,.26);
    tones.forEach(function(n,i){P(1,n,.9,.20-i*.015);P(1,n+12,.9,.14-i*.015);});
    P(2,root-24,.5,.40);P(2,root-12,.5,.32);
    P(2.75,up(2),.25,.24);
    tones.forEach(function(n,i){P(3,n+12,.9,.18-i*.015);});
  }else if(tex==="coda"){
    P(0,root-24,3.8,.40);P(0,root-12,3.8,.30);
    tones.forEach(function(n,i){P(0,n,3.6,.18-i*.015);P(0,n+12,3.6,.12-i*.012);});
    P(3,up(4),1,.14);
  }else if(tex==="trio"){
    /* the quiet middle: legato, pedalled, the tune carried on top */
    P(0,root-12,3.9,.26);P(0,root-5,3.9,.15);
    const shape=barIdx%2===0?[0,1,2,3,2,1]:[2,3,4,3,2,1];
    shape.forEach(function(k,i){P(i*.6667,up(k),1.2,.095+(i===0?.05:0));});
  }else if(tex==="hnA"){
    P(0,root-12,1.9,.30);P(1,up(1),1,.13);P(2,root-5,1.9,.22);
    if(rnd()<.7)P(3,up(2),1,.12);
    if(rnd()<.25)P(3.5,up(3),.5,.09);
  }else if(tex==="hnB"){
    P(0,root-12,2.4,.30);
    const patt=rnd()<.5?[0,1,2,1,2,3]:[0,2,1,2,3,2];
    patt.forEach(function(k,i){P(i*.6667,up(k),.9,.11+(i===0?.06:0));});
    P(2,root-5,2,.18);
    if(rnd()<.3)P(3.66,approach()-12,.34,.13);
  }else if(tex==="hnC"){
    P(0,root-12,4,.32);P(0,root-5,4,.18);
    [0,2,1,3,2,4].forEach(function(k,i){P(i*.6667,up(k),1.1,.10);});
  }
}

/* ---------- audio graph ---------- */
let AC=null,MASTER=null,WET=null,MUSICBUS=null,AMB=null,ambNodes=null;
let playing=false,schedTimer=null,barIdx=0,nextBarTime=0,SONG=null,vibLFO=null;

function initAudio(){
  if(AC)return AC;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  MASTER=AC.createGain();MASTER.gain.value=0.0001;
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-14;comp.knee.value=22;comp.ratio.value=3.2;
  comp.attack.value=.006;comp.release.value=.25;
  MASTER.connect(comp);comp.connect(AC.destination);

  MUSICBUS=AC.createGain();MUSICBUS.gain.value=1;MUSICBUS.connect(MASTER);

  const conv=AC.createConvolver();conv.buffer=makeIR(3.4,2.6);
  WET=AC.createGain();WET.gain.value=.34;
  const wetTone=AC.createBiquadFilter();wetTone.type="lowpass";wetTone.frequency.value=3600;
  WET.connect(conv);conv.connect(wetTone);wetTone.connect(MASTER);

  vibLFO=AC.createOscillator();vibLFO.frequency.value=4.8;
  const vg=AC.createGain();vg.gain.value=5.5;
  vibLFO.connect(vg);vibLFO.start();AC._vib=vg;
  setVolume();
  return AC;
}
function makeIR(sec,decay){
  const n=Math.floor(AC.sampleRate*sec),buf=AC.createBuffer(2,n,AC.sampleRate);
  for(let c=0;c<2;c++){
    const d=buf.getChannelData(c);
    for(let i=0;i<n;i++){
      const x=i/n;
      let v=(Math.random()*2-1)*Math.pow(1-x,decay);
      if(i<AC.sampleRate*0.03)v*=i/(AC.sampleRate*0.03);
      d[i]=v;
    }
    // a few early reflections for a room rather than a cave
    [0.011,0.019,0.031,0.047].forEach((tp,k)=>{
      const idx=Math.floor(tp*AC.sampleRate)+c*7;
      if(idx<n)d[idx]+=(k%2?-1:1)*0.34/(k+1);
    });
  }
  return buf;
}
function setVolume(){
  if(!MASTER)return;
  const v=clamp(DB.settings.volume,0,1)*0.62;
  MASTER.gain.cancelScheduledValues(AC.currentTime);
  MASTER.gain.setTargetAtTime(Math.max(0.0001,v),AC.currentTime,.15);
}

/* ---------- voices ---------- */
const mtof=m=>440*Math.pow(2,(m-69)/12);
function piano(time,midi,dur,vel,bus){
  const f=mtof(midi),out=bus||MUSICBUS;
  const all=[[1,1],[2.001,.44],[3.006,.20],[4.012,.10],[5.02,.055],[6.04,.028],[8.09,.012]];
  const parts=all.slice(0,vel>.34?7:vel>.17?5:4);
  const bright=clamp((90-midi)/58,.25,1);
  parts.forEach(([mul,amp],i)=>{
    const o=AC.createOscillator();o.type="sine";o.frequency.value=f*mul;
    const g=AC.createGain();
    const peak=vel*amp*bright*(i?1:1.1)*.5;
    const tau=Math.max(.22,(2.9/(1+i*.85))*(1-clamp((midi-40)/150,0,.7)));
    g.gain.setValueAtTime(0,time);
    g.gain.linearRampToValueAtTime(peak,time+.006+i*.001);
    g.gain.exponentialRampToValueAtTime(.0001,time+Math.min(tau*2.4,dur*0.55+tau));
    o.connect(g);g.connect(out);g.connect(WET);
    o.start(time);o.stop(time+Math.min(tau*2.6,dur*0.6+tau)+.05);
  });
  // hammer
  const nb=noiseBuf(.05),src=AC.createBufferSource();src.buffer=nb;
  const bp=AC.createBiquadFilter();bp.type="bandpass";bp.frequency.value=f*2.4;bp.Q.value=.9;
  const ng=AC.createGain();ng.gain.setValueAtTime(vel*.05,time);
  ng.gain.exponentialRampToValueAtTime(.0001,time+.055);
  src.connect(bp);bp.connect(ng);ng.connect(out);src.start(time);src.stop(time+.06);
}
function flute(time,midi,dur,vel){
  const f=mtof(midi),d=Math.max(.35,dur);
  const o=AC.createOscillator();o.type="sine";o.frequency.value=f;
  const o2=AC.createOscillator();o2.type="triangle";o2.frequency.value=f*2;
  const g=AC.createGain(),g2=AC.createGain();
  AC._vib.connect(o.detune);AC._vib.connect(o2.detune);
  const a=.085,r=.22;
  g.gain.setValueAtTime(0,time);
  g.gain.linearRampToValueAtTime(vel*.30,time+a);
  g.gain.linearRampToValueAtTime(vel*.24,time+d*.7);
  g.gain.linearRampToValueAtTime(0,time+d+r);
  g2.gain.setValueAtTime(0,time);
  g2.gain.linearRampToValueAtTime(vel*.035,time+a*1.4);
  g2.gain.linearRampToValueAtTime(0,time+d+r*.6);
  const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=f*4.5;
  o.connect(g);o2.connect(g2);g.connect(lp);g2.connect(lp);
  lp.connect(MUSICBUS);lp.connect(WET);
  o.start(time);o2.start(time);o.stop(time+d+r+.05);o2.stop(time+d+r+.05);
  // breath
  const src=AC.createBufferSource();src.buffer=noiseBuf(.4);
  const bp=AC.createBiquadFilter();bp.type="bandpass";bp.frequency.value=f*1.6;bp.Q.value=1.1;
  const ng=AC.createGain();
  ng.gain.setValueAtTime(0,time);
  ng.gain.linearRampToValueAtTime(vel*.028,time+.05);
  ng.gain.exponentialRampToValueAtTime(.0005,time+Math.min(d,.9));
  src.connect(bp);bp.connect(ng);ng.connect(MUSICBUS);
  src.start(time);src.stop(time+Math.min(d,.9)+.05);
}
function pad(time,midi,dur,vel){
  const f=mtof(midi);
  const o=AC.createOscillator();o.type="sawtooth";o.frequency.value=f;
  const o2=AC.createOscillator();o2.type="sawtooth";o2.frequency.value=f*1.005;
  const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=520;lp.Q.value=.6;
  const g=AC.createGain();
  g.gain.setValueAtTime(0,time);
  g.gain.linearRampToValueAtTime(vel*.15,time+.9);
  g.gain.linearRampToValueAtTime(0,time+dur+.8);
  o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(MUSICBUS);g.connect(WET);
  o.start(time);o2.start(time);o.stop(time+dur+1);o2.stop(time+dur+1);
}
let _nb={};
function noiseBuf(sec){
  const k=sec.toFixed(2);
  if(_nb[k])return _nb[k];
  const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  _nb[k]=b;return b;
}

/* ---------- transport ---------- */
function startMusic(){
  initAudio();
  if(AC.state==="suspended")AC.resume();
  SONG=buildSong(L.world==="hng"?HNG:L.world==="shore"?MARCH:VALE);
  if(playing)return;
  playing=true;barIdx=0;nextBarTime=AC.currentTime+.15;
  clearInterval(schedTimer);
  schedTimer=setInterval(scheduler,40);
  MUSICBUS.gain.cancelScheduledValues(AC.currentTime);
  MUSICBUS.gain.setValueAtTime(0.0001,AC.currentTime);
  MUSICBUS.gain.setTargetAtTime(1,AC.currentTime,1.2);
}
function stopMusic(){
  if(!AC)return;
  playing=false;clearInterval(schedTimer);
  MUSICBUS.gain.setTargetAtTime(0.0001,AC.currentTime,.4);
}
function restartMusic(){
  if(!DB.settings.music)return;
  playing=false;clearInterval(schedTimer);
  if(AC)MUSICBUS.gain.setTargetAtTime(0.0001,AC.currentTime,.35);
  setTimeout(()=>{if(DB.settings.music)startMusic();},700);
}
function scheduler(){
  if(!playing||!SONG)return;
  while(nextBarTime<AC.currentTime+.9){
    const bar=SONG.bars[barIdx%SONG.bars.length];
    const beat=(60/SONG.bpm)*(bar.tmul||1), barDur=beat*4;
    (bar.ev||bar).forEach(n=>{
      const jitter=(Math.random()-.5)*.014;
      const at=nextBarTime+n.t*beat+jitter;
      const dur=n.dur*beat;
      const v=n.v*(.9+Math.random()*.2);
      if(at<AC.currentTime)return;
      if(n.voice==="piano")piano(at,n.midi,dur,v);
      else if(n.voice==="flute")flute(at,n.midi,dur,v);
      else if(n.voice==="pad")pad(at,n.midi,dur,v);
    });
    nextBarTime+=barDur;barIdx++;
  }
}

/* ---------- ambience & cues ---------- */
function startAmbience(){
  initAudio();if(AC.state==="suspended")AC.resume();
  if(ambNodes)return;
  const src=AC.createBufferSource();src.buffer=noiseBuf(2.4);src.loop=true;
  const bp=AC.createBiquadFilter();
  bp.type=L.world==="hng"?"lowpass":"bandpass";
  bp.frequency.value=L.world==="hng"?680:900;bp.Q.value=.7;
  const g=AC.createGain();g.gain.value=0;
  const lfo=AC.createOscillator();lfo.frequency.value=.055;
  const lg=AC.createGain();lg.gain.value=L.world==="hng"?260:180;
  lfo.connect(lg);lg.connect(bp.frequency);
  src.connect(bp);bp.connect(g);g.connect(MASTER);g.connect(WET);
  src.start();lfo.start();
  g.gain.setTargetAtTime(.05,AC.currentTime,2);
  const birds=setInterval(()=>{
    if(!ambNodes)return;
    if(Math.random()<.35)chirp();
  },5200);
  ambNodes={src,g,lfo,birds};
}
function stopAmbience(){
  if(!ambNodes)return;
  const {src,g,lfo,birds}=ambNodes;ambNodes=null;
  clearInterval(birds);
  g.gain.setTargetAtTime(.0001,AC.currentTime,.6);
  setTimeout(()=>{try{src.stop();lfo.stop();}catch(e){}},1400);
}
function chirp(){
  const t0=AC.currentTime+Math.random()*.5;
  const o=AC.createOscillator();o.type="sine";
  const f=L.world==="hng"?1800+Math.random()*900:2400+Math.random()*1200;
  o.frequency.setValueAtTime(f,t0);
  o.frequency.exponentialRampToValueAtTime(f*(L.world==="hng"?1.5:.7),t0+.12);
  const g=AC.createGain();g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(.018,t0+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t0+.22);
  o.connect(g);g.connect(MASTER);g.connect(WET);
  o.start(t0);o.stop(t0+.3);
}
function cue(freq,dur,gain){
  if(!DB.settings.cues||!AC||AC.state!=="running")return;
  const t0=AC.currentTime;
  const o=AC.createOscillator();o.type="sine";o.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(gain||.04,t0+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t0+(dur||.08));
  o.connect(g);g.connect(MASTER);g.connect(WET);
  o.start(t0);o.stop(t0+(dur||.08)+.05);
}
function chime(){
  if(!AC)initAudio();
  if(AC.state!=="running")return;
  const t0=AC.currentTime;
  [0,4,7,11,14].forEach((iv,i)=>{
    const o=AC.createOscillator();o.type="sine";o.frequency.value=mtof(74+iv);
    const g=AC.createGain();const at=t0+i*.075;
    g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.055,at+.01);
    g.gain.exponentialRampToValueAtTime(.0001,at+1.8);
    o.connect(g);g.connect(MASTER);g.connect(WET);
    o.start(at);o.stop(at+2);
  });
}

/* ============================================================================
   THE VIEW — painted in two dimensions, on purpose.

   Static strata, cached once and parallaxed a few pixels. What matters here is
   not motion but drawing: how a curtain wall is actually put together, how a
   setback reads against the sky, where the light falls and what it leaves dark.

   Vale  (en) — a terraced night garden. Beyond it: villas, then the financial
               district, then the Burj, and behind the Burj the Aurelian Spire,
               half again its height, because someone decided to.
   Shore (ru) — a balcony eight floors up: glass rail, sea, and a residential
               coast of towers stacked with balconies.
   Hng   (hk) — mountains, terraced fields, one lit house, mother and child.
   ========================================================================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function lerp(a,b,x){return a+(b-a)*x;}
function rgbOf(c){
  if(c[0]==="#")return [1,3,5].map(i=>parseInt(c.substr(i,2),16));
  const m=c.match(/-?\d+\.?\d*/g)||[0,0,0];return [+m[0],+m[1],+m[2]];
}
function hexmix(c1,c2,x){
  const a=rgbOf(c1),b=rgbOf(c2);
  return "rgb("+a.map((v,i)=>Math.round(lerp(v,b[i],x))).join(",")+")";
}
function rgba(c,a){const v=rgbOf(c);return "rgba("+v[0]+","+v[1]+","+v[2]+","+a+")";}

const SC={w:0,h:0,dpr:1,layers:[],px:0,py:0,tx:0,ty:0,parts:[],raf:0,burst:[],grain:null};

const SKY={
  vale:{night:["#05040F","#100C26","#241839","#3E2749","#5A3652"],
        dusk :["#120C26","#301B44","#6E3352","#C4664F","#EC9C5E"],
        day  :["#2B69B4","#6BA4DE","#A6CCEA","#D6E6EC","#F0E4CE"]},
  shore:{night:["#04060F","#0A1230","#13284A","#234465","#3A6478"],
         dusk :["#180F32","#3A1D52","#84375E","#DC6E4C","#FFBE74"],
         day  :["#1B6ABC","#4A97D9","#8CC4EA","#C4E2F0","#F0ECDA"]},
  hng:{night:["#03060E","#0A1530","#152645","#293C58","#41566B"],
       dusk :["#1C122E","#4E2640","#A44C3C","#DC864A","#F4B86E"],
       day  :["#3A86C8","#7BB8E6","#B4D8EE","#DAECF0","#EEEED6"]}
};
const LIGHT={
  vale :{night:{x:.74,y:.15,warm:"#E9EDFB",glow:"#8E9AD8"},
         dusk :{x:.74,y:.44,warm:"#FFD9A0",glow:"#E8845C"},
         day  :{x:.74,y:.17,warm:"#FFF3D6",glow:"#FFE0A8"}},
  shore:{night:{x:.28,y:.19,warm:"#EDF2FF",glow:"#7FA0D0"},
         dusk :{x:.28,y:.50,warm:"#FFD79A",glow:"#F07A4E"},
         day  :{x:.28,y:.17,warm:"#FFF6E0",glow:"#FFDCA0"}},
  hng  :{night:{x:.24,y:.18,warm:"#F4F0DC",glow:"#8FA0C0"},
         dusk :{x:.24,y:.42,warm:"#FFD397",glow:"#E8763F"},
         day  :{x:.24,y:.15,warm:"#FFF6DE",glow:"#FFE2A0"}}
};
const tod=()=>DB.settings.tod;
const lightOf=()=>LIGHT[L.world][tod()];
const skyOf=()=>SKY[L.world][tod()];

function layer(){
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.ceil(SC.w*SC.dpr));
  c.height=Math.max(1,Math.ceil(SC.h*SC.dpr));
  const g=c.getContext("2d");g.scale(SC.dpr,SC.dpr);
  return {c:c,g:g};
}
function bloom(l,amount,spread){
  if(DB.settings.motion==="still")return;
  try{
    const c=l.c,g=l.g;
    const tmp=document.createElement("canvas");
    tmp.width=Math.max(1,Math.round(c.width/3));
    tmp.height=Math.max(1,Math.round(c.height/3));
    const tg=tmp.getContext("2d");
    tg.drawImage(c,0,0,tmp.width,tmp.height);
    tg.globalCompositeOperation="multiply";       // square it: only highlights survive
    tg.drawImage(tmp,0,0);
    g.save();g.setTransform(1,0,0,1,0,0);
    g.globalCompositeOperation="lighter";
    const s=spread;
    const steps=[[0,0],[s,0],[-s,0],[0,s],[0,-s],[s*.7,s*.7],[-s*.7,s*.7],[s*.7,-s*.7],[-s*.7,-s*.7]];
    g.globalAlpha=amount/steps.length;
    steps.forEach(function(d){g.drawImage(tmp,d[0],d[1],c.width,c.height);});
    g.restore();
  }catch(e){}
}
function haze(g,y0,y1,col,a0,a1){
  const gr=g.createLinearGradient(0,y0,0,y1);
  gr.addColorStop(0,rgba(col,a0));gr.addColorStop(1,rgba(col,a1));
  g.fillStyle=gr;g.fillRect(0,y0,SC.w,y1-y0);
}
function grainTile(){
  if(SC.grain)return SC.grain;
  const c=document.createElement("canvas");c.width=c.height=96;
  const g=c.getContext("2d"),im=g.createImageData(96,96);
  for(let i=0;i<im.data.length;i+=4){
    const v=200+Math.random()*55;
    im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;
  }
  g.putImageData(im,0,0);SC.grain=c;return c;
}

/* ============================================================================
   ARCHITECTURE
   A tower is not a rectangle with dots on it. Every one of these gets a floor
   height, a structural grid, spandrels between the vision glass, mechanical
   levels that never light up, a podium at the street, a parapet, and a crown.
   Floors light in clusters, because people light whole floors, not windows.
   ========================================================================== */
const FLOOR=3.6;                                  // px per storey at reference scale

function facade(g,x,y,w,h,o){
  /* the glass itself: a vertical gradient, brighter where it catches sky */
  const R=o.R,night=o.night,evening=o.evening;
  if(evening)o=Object.assign({},o,{glass:hexmix(o.glass,"#1A1020",.52)});
  const gl=g.createLinearGradient(x,y,x,y+h);
  gl.addColorStop(0,hexmix(o.glass,o.sky,.34));
  gl.addColorStop(.55,o.glass);
  gl.addColorStop(1,hexmix(o.glass,"#000000",night?.30:.16));
  g.fillStyle=gl;g.fillRect(x,y,w,h);
  /* a raking sheen across the curtain wall — glass is never matte */
  const sh=g.createLinearGradient(x,y,x+w,y+h*.5);
  sh.addColorStop(0,rgba("#FFFFFF",0));
  sh.addColorStop(.44,rgba(o.sheen||"#FFFFFF",night?.05:.16));
  sh.addColorStop(.62,rgba("#FFFFFF",0));
  g.fillStyle=sh;g.fillRect(x,y,w,h);

  const fh=o.floor||FLOOR;
  const floors=Math.max(1,Math.floor(h/fh));
  const bay=o.bay||5.4;
  const bays=Math.max(1,Math.round(w/bay));
  const bw=w/bays;
  /* spandrel band under every floor plate */
  g.fillStyle=rgba(o.spandrel||"#000000",night?.46:.24);
  for(let f=0;f<floors;f++)g.fillRect(x,y+f*fh+fh*.66,w,fh*.34);
  /* mullions on the structural grid, with fatter columns at the bays */
  g.fillStyle=rgba(o.mullion||"#000000",night?.34:.22);
  for(let b=0;b<=bays;b++){
    const mx=x+b*bw;
    g.fillRect(mx-(b%3===0?.9:.45),y,b%3===0?1.8:.9,h);
  }
  /* mechanical floors: solid, unglazed, and they never light */
  const mech=[];
  for(let f=Math.round(floors*.28);f<floors;f+=Math.max(6,Math.round(floors*.30))){
    mech.push(f);
    g.fillStyle=hexmix(o.solid||o.glass,"#000000",.34);
    g.fillRect(x,y+f*fh,w,fh*1.05);
    g.fillStyle=rgba("#FFFFFF",night?.05:.12);
    g.fillRect(x,y+f*fh,w,.8);
  }
  /* the lights, clustered by floor */
  if(night||evening){
    const litFloor=night?.30:.10;
    for(let f=0;f<floors;f++){
      if(mech.indexOf(f)>=0)continue;
      const on=R()<litFloor;
      if(!on)continue;
      const warm=R()<.80;
      const from=Math.floor(R()*bays), span=1+Math.floor(R()*Math.min(bays,4));
      for(let b=from;b<Math.min(bays,from+span);b++){
        g.fillStyle=warm?o.warm:"#CFE2FF";
        g.globalAlpha=(night?.55:.32)+R()*.4;
        g.fillRect(x+b*bw+bw*.16,y+f*fh+fh*.10,bw*.68,fh*.50);
      }
    }
    g.globalAlpha=1;
  }
}
/* one tower: massing tiers, podium, parapet, crown, mast */
function tower(g,o){
  const R=o.R,night=o.night;
  const base=o.base, w0=o.w, h=o.h, x=o.x;
  const tiers=o.tiers||3;
  const lit=o.lit, dark=o.dark;
  let y=base, wCur=w0;
  const setback=o.setback===undefined?0.13:o.setback;
  for(let t=0;t<tiers;t++){
    const th=h*(t===tiers-1?(1-(tiers-1)/tiers):1/tiers)*(o.tierMix?(1+(t-1)*.12):1);
    const yTop=y-th;
    const cx=x+w0/2;
    const xa=cx-wCur/2;
    /* shadow return on the far side */
    const side=Math.max(2.5,wCur*.16);
    g.fillStyle=hexmix(dark,"#000000",.12);
    g.beginPath();
    g.moveTo(xa+wCur,yTop);g.lineTo(xa+wCur+side,yTop+side*.5);
    g.lineTo(xa+wCur+side,y+side*.5);g.lineTo(xa+wCur,y);g.closePath();g.fill();
    facade(g,xa,yTop,wCur,th,{glass:lit,solid:dark,sky:o.sky,warm:o.warm,
      night:night,evening:o.evening,R:R,floor:o.floor,bay:o.bay,
      spandrel:o.spandrel,mullion:o.mullion,sheen:o.sheen});
    /* floor plate edge at each setback, catching the light */
    g.fillStyle=rgba(o.rim||"#FFFFFF",night?.16:.42);
    g.fillRect(xa-1.4,yTop-1.6,wCur+2.8,1.6);
    g.fillStyle=rgba("#000000",.25);
    g.fillRect(xa-1.4,yTop,wCur+2.8,1);
    y=yTop; wCur=wCur*(1-setback);
  }
  /* podium: taller floors, a canopy, a lit lobby */
  if(o.podium){
    const pw=w0*1.34,ph=o.podium;
    const px=x+w0/2-pw/2;
    g.fillStyle=hexmix(dark,"#000000",.06);
    g.fillRect(px,base-ph,pw,ph);
    facade(g,px,base-ph,pw,ph,{glass:hexmix(lit,"#000000",.18),solid:dark,sky:o.sky,
      warm:o.warm,night:night,evening:o.evening,R:R,floor:(o.floor||FLOOR)*1.7,bay:(o.bay||5.4)*1.5,
      spandrel:o.spandrel,mullion:o.mullion});
    if(night||o.evening){
      const sp=g.createLinearGradient(px,base-ph,px,base+ph*.5);
      sp.addColorStop(0,rgba(o.warm,0));sp.addColorStop(1,rgba(o.warm,.22));
      g.fillStyle=sp;g.fillRect(px-pw*.2,base-ph,pw*1.4,ph*1.4);
    }
    g.fillStyle=rgba(o.rim||"#FFFFFF",night?.2:.5);
    g.fillRect(px-2,base-ph-1.8,pw+4,1.8);
  }
  /* roof clutter: tanks, plant, a rail — the things nobody draws but everyone sees */
  const cxT=x+w0/2, topY=y;
  if(o.crown!=="none"&&wCur>10){
    const rf=o.R;
    g.fillStyle=hexmix(dark,"#000000",.28);
    for(let i=0;i<3;i++){
      if(rf()<.45)continue;
      const rw=wCur*(.12+rf()*.16),rh=wCur*(.10+rf()*.14);
      g.fillRect(cxT-wCur/2+rf()*(wCur-rw),topY-rh,rw,rh);
    }
    g.strokeStyle=rgba(o.rim||"#FFFFFF",night?.16:.36);g.lineWidth=.8;
    for(let i=0;i<4;i++){
      if(rf()<.5)continue;
      const ax=cxT-wCur/2+rf()*wCur;
      g.beginPath();g.moveTo(ax,topY);g.lineTo(ax,topY-wCur*(.16+rf()*.24));g.stroke();
    }
  }
  if(o.crown!=="none"){
    const cw=wCur*.62;
    const ct=o.crownType||"box";
    g.fillStyle=hexmix(dark,"#000000",.18);
    if(ct==="tier"){
      g.fillRect(cxT-cw/2,topY-cw*.42,cw,cw*.42);
      g.fillRect(cxT-cw*.34,topY-cw*.74,cw*.68,cw*.34);
      g.fillRect(cxT-cw*.20,topY-cw*.98,cw*.40,cw*.26);
    }else if(ct==="spire"){
      g.beginPath();g.moveTo(cxT-cw/2,topY);g.lineTo(cxT,topY-cw*1.5);
      g.lineTo(cxT+cw/2,topY);g.closePath();g.fill();
    }else if(ct==="arch"){
      g.beginPath();g.moveTo(cxT-cw/2,topY);
      g.quadraticCurveTo(cxT,topY-cw*1.15,cxT+cw/2,topY);g.closePath();g.fill();
    }else{
      g.fillRect(cxT-cw/2,topY-cw*.5,cw,cw*.5);
    }
    g.fillStyle=rgba(o.rim||"#FFFFFF",night?.14:.4);
    g.fillRect(cxT-cw/2,topY-cw*.5,cw,1.2);
    if(o.mast!==false){
      g.strokeStyle=hexmix(dark,"#FFFFFF",night?.2:.35);g.lineWidth=1.5;
      g.beginPath();g.moveTo(cxT,topY-cw*.5);g.lineTo(cxT,topY-cw*.5-h*.10);g.stroke();
      if(night){
        g.fillStyle="rgba(255,86,86,.95)";
        g.beginPath();g.arc(cxT,topY-cw*.5-h*.10,1.7,0,7);g.fill();
      }
    }
    if(night){                                   /* crown floodlight, close in */
      const cg=g.createRadialGradient(cxT,topY+wCur*.2,1,cxT,topY+wCur*.2,wCur*1.05);
      cg.addColorStop(0,rgba(o.warm,.20));cg.addColorStop(1,rgba(o.warm,0));
      g.fillStyle=cg;g.beginPath();g.arc(cxT,topY+wCur*.2,wCur*1.05,0,7);g.fill();
    }
  }
  return {top:topY,wTop:wCur};
}
/* the Burj: a buttressed core, three wings, twenty-odd spiralling setbacks,
   and a spire that is nearly a third of the whole height. */
function burj(g,x,base,H,o){
  const night=o.night,R=o.R;
  const shaftH=H*0.70, spireH=H*0.30;
  const W=H*0.082;                                  // slenderness, roughly the real one
  const wings=[{off:-0.86,scale:0.52,top:0.52},{off:0.86,scale:0.52,top:0.63}];
  wings.forEach(function(wg){
    const ww=W*wg.scale, wx=x+W*wg.off-ww/2, wh=shaftH*wg.top;
    const steps=9;
    let yy=base, cw=ww;
    for(let i=0;i<steps;i++){
      const th=wh/steps, yTop=yy-th;
      facade(g,x+W*wg.off-cw/2,yTop,cw,th,{glass:hexmix(o.lit,o.sky,.10+i*.03),
        solid:o.dark,sky:o.sky,warm:o.warm,night:night,evening:o.evening,R:R,
        floor:2.6,bay:4.2,spandrel:o.spandrel,mullion:o.mullion});
      g.fillStyle=rgba(o.rim,night?.15:.4);
      g.fillRect(x+W*wg.off-cw/2,yTop,cw,1);
      yy=yTop;cw*=0.90;
    }
  });
  /* central core, stepping back the whole way up */
  const steps=22;
  let y=base, cw=W;
  for(let i=0;i<steps;i++){
    const th=shaftH/steps, yTop=y-th;
    facade(g,x-cw/2,yTop,cw,th,{glass:hexmix(o.lit,o.sky,.06+i*.028),
      solid:o.dark,sky:o.sky,warm:o.warm,night:night,evening:o.evening,R:R,
      floor:2.5,bay:4.0,spandrel:o.spandrel,mullion:o.mullion});
    g.fillStyle=rgba(o.rim,night?.16:.44);
    g.fillRect(x-cw/2-.8,yTop-1,cw+1.6,1.1);
    y=yTop; cw*=(1-0.030-(i>13?0.022:0));
  }
  /* the spire: a long tapering needle with a lit tip */
  const tipW=cw;
  const grd=g.createLinearGradient(x-tipW,y,x+tipW,y-spireH);
  grd.addColorStop(0,hexmix(o.lit,"#FFFFFF",night?.10:.30));
  grd.addColorStop(1,hexmix(o.lit,o.sky,.45));
  g.fillStyle=grd;
  g.beginPath();
  g.moveTo(x-tipW/2,y);g.lineTo(x+tipW/2,y);
  g.lineTo(x+0.7,y-spireH);g.lineTo(x-0.7,y-spireH);g.closePath();g.fill();
  for(let i=0;i<7;i++){                            /* collar rings up the needle */
    const f=i/7, yy=y-spireH*f, ww=lerp(tipW,1.6,f)*1.5;
    g.strokeStyle=rgba(night?"#F0D096":"#FFFFFF",night?.30:.35);
    g.lineWidth=1;g.beginPath();g.moveTo(x-ww/2,yy);g.lineTo(x+ww/2,yy);g.stroke();
  }
  if(night){
    g.fillStyle="rgba(255,86,86,.95)";
    g.beginPath();g.arc(x,y-spireH,2,0,7);g.fill();
    const cg=g.createRadialGradient(x,y-spireH*.6,2,x,y-spireH*.6,H*.10);
    cg.addColorStop(0,rgba(o.warm,.22));cg.addColorStop(1,rgba(o.warm,0));
    g.fillStyle=cg;g.beginPath();g.arc(x,y-spireH*.6,H*.10,0,7);g.fill();
  }
  return base-H;
}
/* the Aurelian Spire: taller than the Burj by half again, three tapering
   blades braced around a lit core, with sky lobbies where they cross. */
function aurelianSpire(g,x,base,H,o){
  const night=o.night,R=o.R;
  const W=H*0.046;
  const shaftH=H*0.80, needle=H*0.20;
  const blade=function(off,scale,topF){
    const steps=26;
    let y=base,cw=W*scale;
    for(let i=0;i<steps;i++){
      const f=i/steps;
      if(f>topF)break;
      const th=shaftH/steps, yTop=y-th;
      const cx=x+off*W*(1-f*.55);
      facade(g,cx-cw/2,yTop,cw,th,{glass:hexmix(o.lit,o.sky,.05+f*.42),
        solid:o.dark,sky:o.sky,warm:o.warm,night:night,evening:o.evening,R:R,
        floor:2.3,bay:3.6,spandrel:o.spandrel,mullion:o.mullion,sheen:o.rim});
      g.fillStyle=rgba(o.rim,night?.13:.34);
      g.fillRect(cx-cw/2,yTop,cw,.9);
      if(i%6===5){                                  /* sky lobby: a lit double band */
        g.fillStyle=rgba(o.warm,night?.55:.24);
        g.fillRect(cx-cw/2-1.6,yTop-1.4,cw+3.2,2.6);
      }
      y=yTop;cw*=0.972;
    }
    return y;
  };
  blade(-0.92,0.70,0.70);
  blade( 0.92,0.70,0.84);
  const topY=blade(0,1.0,1.0);
  /* the needle */
  const grd=g.createLinearGradient(x,topY,x,topY-needle);
  grd.addColorStop(0,hexmix(o.lit,"#FFFFFF",night?.16:.34));
  grd.addColorStop(1,hexmix(o.lit,o.sky,.55));
  g.fillStyle=grd;
  g.beginPath();
  g.moveTo(x-W*.30,topY);g.lineTo(x+W*.30,topY);
  g.lineTo(x+0.8,topY-needle);g.lineTo(x-0.8,topY-needle);g.closePath();g.fill();
  for(let i=0;i<10;i++){
    const f=i/10,yy=topY-needle*f,ww=lerp(W*.60,2,f);
    g.strokeStyle=rgba(night?"#F4DCA8":"#FFFFFF",night?.16+.34*(1-f):.30);
    g.lineWidth=1;g.beginPath();g.moveTo(x-ww/2,yy);g.lineTo(x+ww/2,yy);g.stroke();
  }
  if(night){
    const cg=g.createRadialGradient(x,topY-needle*.2,2,x,topY-needle*.2,H*.16);
    cg.addColorStop(0,rgba(o.warm,.34));cg.addColorStop(1,rgba(o.warm,0));
    g.fillStyle=cg;g.beginPath();g.arc(x,topY-needle*.2,H*.16,0,7);g.fill();
    g.fillStyle="rgba(255,86,86,.95)";
    g.beginPath();g.arc(x,topY-needle,2.2,0,7);g.fill();
  }
}
/* a residential slab: balcony stacks, which is what actually makes them read */
function residential(g,o){
  const R=o.R,night=o.night;
  if(o.evening)o=Object.assign({},o,{lit:hexmix(o.lit,"#1E1224",.50),
                                     dark:hexmix(o.dark,"#160E1C",.45)});
  const x=o.x,base=o.base,w=o.w,h=o.h;
  const side=Math.max(2.5,w*.16);
  g.fillStyle=hexmix(o.dark,"#000000",.10);
  g.beginPath();
  g.moveTo(x+w,base-h);g.lineTo(x+w+side,base-h+side*.5);
  g.lineTo(x+w+side,base+side*.5);g.lineTo(x+w,base);g.closePath();g.fill();
  const bg=g.createLinearGradient(x,base-h,x,base);
  bg.addColorStop(0,hexmix(o.lit,o.sky,.26));bg.addColorStop(1,hexmix(o.lit,"#000000",night?.28:.10));
  g.fillStyle=bg;g.fillRect(x,base-h,w,h);
  const fh=o.floor||4.6;
  const floors=Math.max(2,Math.floor(h/fh));
  const bays=Math.max(2,Math.round(w/9));
  const bw=w/bays;
  for(let f=0;f<floors;f++){
    const y=base-h+f*fh;
    /* the recessed loggia behind each balcony */
    for(let b=0;b<bays;b++){
      const on=(night||o.evening)&&R()<(night?.44:.16);
      g.fillStyle=on?o.warm:rgba("#000000",night?.52:.30);
      g.globalAlpha=on?(.45+R()*.5):1;
      g.fillRect(x+b*bw+bw*.14,y+fh*.16,bw*.72,fh*.46);
      g.globalAlpha=1;
    }
    /* the slab, and the rail on top of it */
    g.fillStyle=hexmix(o.lit,"#FFFFFF",night?.06:.22);
    g.fillRect(x,y+fh*.62,w,fh*.20);
    g.fillStyle=rgba("#FFFFFF",night?.10:.34);
    g.fillRect(x,y+fh*.62,w,.9);
    g.fillStyle=rgba(o.rail||"#8898B0",night?.30:.5);
    g.fillRect(x,y+fh*.44,w,fh*.055);
    for(let b=0;b<=bays;b++)g.fillRect(x+b*bw-.4,y+fh*.44,.8,fh*.20);
  }
  g.fillStyle=rgba("#FFFFFF",night?.12:.4);
  g.fillRect(x-1,base-h-1.6,w+2,1.6);
  if(o.rooftop){
    g.fillStyle=hexmix(o.dark,"#000000",.2);
    g.fillRect(x+w*.22,base-h-w*.16,w*.34,w*.16);
    g.fillRect(x+w*.62,base-h-w*.10,w*.16,w*.10);
    /* water tanks and a stair head */
    g.fillStyle=hexmix(o.dark,"#000000",.32);
    g.fillRect(x+w*.06,base-h-w*.22,w*.12,w*.22);
    g.beginPath();g.ellipse(x+w*.12,base-h-w*.22,w*.06,w*.03,0,0,7);g.fill();
    g.strokeStyle=rgba("#FFFFFF",night?.14:.3);g.lineWidth=.8;
    g.beginPath();g.moveTo(x+w*.84,base-h);g.lineTo(x+w*.84,base-h-w*.30);g.stroke();
    if(night){g.fillStyle="rgba(255,86,86,.9)";
      g.beginPath();g.arc(x+w*.84,base-h-w*.30,1.4,0,7);g.fill();}
  }
}
function palm(g,x,y,s,trunk,frond,rim){
  g.strokeStyle=trunk;g.lineWidth=3.6*s;g.lineCap="round";
  g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x-7*s,y-36*s,x+5*s,y-66*s);g.stroke();
  const cx=x+5*s,cy=y-66*s;
  [[-1,1.00,.52],[-1,.80,.30],[-1,.56,.10],[-1,.34,-.06],
   [ 1,1.00,.52],[ 1,.82,.30],[ 1,.58,.10],[ 1,.36,-.06]].forEach(function(f){
    const dir=f[0],len=(30+f[1]*16)*s,drop=f[2];
    const ex=cx+dir*len*(.55+f[1]*.55), ey=cy+len*drop+len*.18;
    const kx=cx+dir*len*(.30+f[1]*.30), ky=cy-len*(.34-drop*.28);
    g.strokeStyle=frond;g.lineWidth=3.0*s;
    g.beginPath();g.moveTo(cx,cy);g.quadraticCurveTo(kx,ky,ex,ey);g.stroke();
    g.strokeStyle=rim;g.lineWidth=1.0*s;
    g.beginPath();g.moveTo(cx,cy);g.quadraticCurveTo(kx,ky-1.6*s,ex,ey-2*s);g.stroke();
    g.strokeStyle=frond;g.lineWidth=1.1*s;
    for(let k=1;k<=3;k++){
      const t=k/4;
      const px=(1-t)*(1-t)*cx+2*(1-t)*t*kx+t*t*ex;
      const py=(1-t)*(1-t)*cy+2*(1-t)*t*ky+t*t*ey;
      g.beginPath();g.moveTo(px,py);g.lineTo(px+dir*5*s,py+7*s);g.stroke();
    }
  });
  g.fillStyle=trunk;g.beginPath();g.arc(cx,cy,3.2*s,0,7);g.fill();
}
function cloud(g,x,y,w,h,litCol,darkCol,alpha,R){
  const puffs=6+Math.floor(R()*4);
  for(let i=0;i<puffs;i++){
    const px=x+(i/(puffs-1)-.5)*w+(R()-.5)*w*.12;
    const scale=1-Math.abs(i/(puffs-1)-.5)*1.2;
    const pw=w*.30*Math.max(.35,scale),ph=h*Math.max(.4,scale);
    const gr=g.createRadialGradient(px,y-ph*.35,ph*.1,px,y,pw);
    gr.addColorStop(0,rgba(litCol,alpha));
    gr.addColorStop(.55,rgba(hexmix(litCol,darkCol,.5),alpha*.85));
    gr.addColorStop(1,rgba(darkCol,0));
    g.fillStyle=gr;g.beginPath();g.ellipse(px,y,pw,ph,0,0,7);g.fill();
  }
}
function glitter(g,cx,y0,y1,col,R){
  for(let i=0;i<170;i++){
    const f=Math.pow(R(),.6);
    const y=y0+f*(y1-y0);
    const spread=lerp(10,SC.w*.30,f);
    const x=cx+(R()-.5)*2*spread*Math.pow(R(),.5);
    const w=lerp(6,44,f)*(.4+R()*.9);
    g.globalAlpha=(1-f*.72)*(.25+R()*.5);
    g.fillStyle=col;g.fillRect(x-w/2,y,w,lerp(.8,2.4,f));
  }
  g.globalAlpha=1;
}
function sunMoon(g,lx,ly,r,warm,glow,isNight){
  const halo=g.createRadialGradient(lx,ly,r*.2,lx,ly,r*8);
  halo.addColorStop(0,rgba(glow,isNight?.40:.52));
  halo.addColorStop(.32,rgba(glow,.15));
  halo.addColorStop(1,rgba(glow,0));
  g.fillStyle=halo;g.beginPath();g.arc(lx,ly,r*8,0,7);g.fill();
  const body=g.createRadialGradient(lx-r*.3,ly-r*.3,r*.1,lx,ly,r);
  body.addColorStop(0,"#FFFFFF");body.addColorStop(.55,warm);
  body.addColorStop(1,hexmix(warm,glow,.5));
  g.fillStyle=body;g.beginPath();g.arc(lx,ly,r,0,7);g.fill();

function stars(g,n,hz,R){
  for(let i=0;i<n;i++){
    const x=R()*SC.w,y=R()*hz,s=R();
    g.globalAlpha=(.15+s*.8)*(1-y/hz*.45);
    g.fillStyle=s>.94?"#CFE0FF":"#FFFFFF";

/* ============================== BUILD ================================== */
function buildScene(){
  const cv=$("#scene");
  SC.w=window.innerWidth;SC.h=window.innerHeight;
  SC.dpr=Math.min(1.35,window.devicePixelRatio||1);
  cv.width=SC.w*SC.dpr;cv.height=SC.h*SC.dpr;
  cv.style.width=SC.w+"px";cv.style.height=SC.h+"px";
  const fx=$("#sceneFx");
  fx.width=SC.w*SC.dpr;fx.height=SC.h*SC.dpr;
  fx.style.width=SC.w+"px";fx.style.height=SC.h+"px";
  SC.layers=L.world==="hng"?buildHng():L.world==="shore"?buildShore():buildVale();
  SC.parts=makeParticles();
  drawScene();
}
function drawScene(){
  const g=$("#scene").getContext("2d");
  g.setTransform(SC.dpr,0,0,SC.dpr,0,0);
  g.clearRect(0,0,SC.w,SC.h);
  const O=30;
  SC.layers.forEach(function(l){
    const dx=-SC.px*l.p*66, dy=-SC.py*l.p*28;
    g.drawImage(l.c,0,0,l.c.width,l.c.height,dx-O,dy-O,SC.w+O*2,SC.h+O*2);
  });
  try{
    const pat=g.createPattern(grainTile(),"repeat");
    g.save();g.globalAlpha=tod()==="night"?.05:.032;
    g.globalCompositeOperation="overlay";
    g.fillStyle=pat;g.fillRect(0,0,SC.w,SC.h);g.restore();
  }catch(e){}
}
function skyLayer(hzFactor,cloudCount,seed){
  const T=tod(),pal=skyOf(),LI=lightOf(),R=mulberry32(seed),night=T==="night";
  const l=layer(),g=l.g,W=SC.w,H=SC.h,hz=H*hzFactor;
  const sky=g.createLinearGradient(0,0,0,hz*1.08);
  pal.forEach((c,i)=>sky.addColorStop(i/(pal.length-1),c));
  g.fillStyle=sky;g.fillRect(0,0,W,hz*1.10);
  if(night)stars(g,440,hz*.95,R);
  sunMoon(g,W*LI.x,H*LI.y,night?34:48,LI.warm,LI.glow,night);
  for(let i=0;i<cloudCount;i++){
    cloud(g,R()*W,hz*(.10+R()*.66),140+R()*340,9+R()*20,
      night?"#5A5488":T==="dusk"?"#FFC49A":"#FFFFFF",
      night?"#171232":T==="dusk"?"#7A3050":"#A8C2D8",
      night?.32:.5,R);
  }
  return {l:l,g:g,R:R,hz:hz,night:night,T:T,pal:pal,LI:LI};
}

   for(let i=0;i<66;i++){

   [[W*.14,hz+H*.045,.85,1],[W*.52,hz+H*.022,.6,1],[W*.78,hz+H*.085,1.15,0],

   });
   /* the marina, moored just off the shoreline */
   {const my=hz+H*.030;

    if(night||T==="dusk"){

   /* the coast lights spilling onto the water */

  /* --- beach and promenade --- */
  {const l=layer(),g2=l.g;

  /* --- the balcony --- */

   }

   g2.strokeStyle=rgba(night?"#AFC4E8":"#FFFFFF",.15);g2.lineWidth=1;

   for(let x=W*.05;x<W;x+=W*.155)g2.fillRect(x,railY,7,floorY-railY);

   /* planter, palm, table */
   palm(g2,W*.075,floorY+H*.035,1.9,night?"#1A1424":"#4A3B26",
        night?"#20323C":"#3E7048",rgba(LI.glow,.5));
   const pot=g2.createLinearGradient(W*.035,0,W*.12,0);
   pot.addColorStop(0,night?"#2A2136":"#D6CAB2");pot.addColorStop(1,night?"#15101E":"#A2977F");
   g2.fillStyle=pot;

   [[-22,"rgba(232,190,140,"],[18,"rgba(224,168,192,"]].forEach(function(o){

/* ================================ HNG ================================== */
function buildHng(){
  const S=skyLayer(0.55,9,9981);
  const {g,R,hz,night,T,pal,LI}=S;
  const W=SC.w,H=SC.h,out=[];
  if(night){
    g.globalAlpha=.5;
    const mw=g.createLinearGradient(0,hz*.06,W,hz*.5);
    mw.addColorStop(0,"rgba(180,190,230,0)");mw.addColorStop(.5,"rgba(196,206,240,.15)");
    mw.addColorStop(1,"rgba(180,190,230,0)");
    g.fillStyle=mw;g.fillRect(0,hz*.04,W,hz*.5);g.globalAlpha=1;
  }
  bloom(S.l,night?.40:.28,4);
  out.push({c:S.l.c,p:.02});

  const ridge=function(yBase,amp,col,seed,pf,trees){
    const l=layer(),g2=l.g,Q=mulberry32(seed);
    const gr=g2.createLinearGradient(0,yBase-amp*2,0,H);
    gr.addColorStop(0,hexmix(col,pal[3],.35));gr.addColorStop(1,col);
    g2.fillStyle=gr;g2.beginPath();g2.moveTo(0,H);
    const pts=[];
    for(let x=0;x<=W+40;x+=32){
      const y=yBase+Math.sin(x/(150+Q()*90)+seed)*amp+Q()*amp*.5-amp*.25;
      pts.push([x,y]);g2.lineTo(x,y);
    }
    g2.lineTo(W,H);g2.closePath();g2.fill();
    g2.strokeStyle=rgba(LI.glow,night?.18:.36);g2.lineWidth=1.6;
    g2.beginPath();pts.forEach((p,i)=>i?g2.lineTo(p[0],p[1]):g2.moveTo(p[0],p[1]));g2.stroke();
    if(trees){
      g2.fillStyle=rgba(col,.9);
      pts.forEach(function(p){
        for(let k=0;k<3;k++){
          const tx=p[0]+Q()*30,th=4+Q()*7;
          g2.beginPath();g2.moveTo(tx,p[1]+2);g2.lineTo(tx+2.2,p[1]-th);
          g2.lineTo(tx+4.4,p[1]+2);g2.closePath();g2.fill();
        }
      });
    }
    haze(g2,yBase-amp*2,yBase+H*.10,pal[3],night?.26:.40,0);
    out.push({c:l.c,p:pf});
  };
  ridge(hz-H*.16,H*.055,night?"#182438":T==="dusk"?"#5C3A48":"#96AFBE",3,.035,false);
  ridge(hz-H*.08,H*.045,night?"#101A2C":T==="dusk"?"#3E2838":"#709496",7,.06,false);
  ridge(hz-H*.01,H*.035,night?"#09101C":T==="dusk"?"#261C28":"#4C7468",11,.095,true);

  {const l=layer(),g2=l.g;
   const top=hz+H*.02;
   for(let i=0;i<10;i++){
     const y=top+i*((H-top)/10)*.86,f=i/9;
     const a=T==="day"?hexmix("#7FA84C","#4E7A32",f):T==="dusk"?hexmix("#6E5F36","#3E341C",f)
                                                    :hexmix("#16241F","#0A1210",f);
     const b=T==="day"?hexmix("#96BC5C","#5E8C3A",f):T==="dusk"?hexmix("#836F42","#4A3E22",f)
                                                    :hexmix("#1D2C26","#0E1816",f);
     const gr=g2.createLinearGradient(0,y,0,y+((H-top)/10));
     gr.addColorStop(0,i%2?a:b);gr.addColorStop(1,i%2?b:a);
     g2.fillStyle=gr;
     g2.beginPath();g2.moveTo(0,y);
     for(let x=0;x<=W;x+=30)g2.lineTo(x,y+Math.sin(x/210+i)*7);
     g2.lineTo(W,H);g2.lineTo(0,H);g2.closePath();g2.fill();
     g2.strokeStyle=rgba(T==="day"?"#3E6A2E":"#000000",T==="day"?.16:.22);g2.lineWidth=1;
     for(let k=0;k<14;k++){
       const yy=y+2+k*1.6*(1+f*2);
       if(yy>y+((H-top)/10))break;
       g2.beginPath();
       for(let x=0;x<=W;x+=40)g2.lineTo(x,yy+Math.sin(x/210+i)*7);
       g2.stroke();
     }
     g2.strokeStyle=rgba(LI.glow,night?.13:.30);g2.lineWidth=1.6;
     g2.beginPath();
     for(let x=0;x<=W;x+=30)g2.lineTo(x,y+Math.sin(x/210+i)*7);g2.stroke();
   }
   g2.strokeStyle=T==="day"?"rgba(220,202,158,.85)":"rgba(150,128,96,.5)";
   g2.lineWidth=11;g2.lineCap="round";
   g2.beginPath();g2.moveTo(W*.68,top+8);g2.quadraticCurveTo(W*.60,H*.82,W*.52,H);g2.stroke();
   g2.strokeStyle=rgba(LI.glow,night?.14:.3);g2.lineWidth=2;
   g2.beginPath();g2.moveTo(W*.676,top+8);g2.quadraticCurveTo(W*.596,H*.82,W*.516,H);g2.stroke();
   const hx=W*.71,hy=top+26,s=1.55;
   const lamp=g2.createRadialGradient(hx+6*s,hy-11*s,2,hx+6*s,hy-11*s,52*s);
   lamp.addColorStop(0,"rgba(255,206,130,"+(T==="day"?.26:.7)+")");
   lamp.addColorStop(1,"rgba(255,200,120,0)");
   g2.fillStyle=lamp;g2.beginPath();g2.arc(hx+6*s,hy-11*s,52*s,0,7);g2.fill();
   if(T!=="day"){
     const spill=g2.createLinearGradient(hx,hy,hx,hy+60*s);
     spill.addColorStop(0,"rgba(255,204,132,.28)");spill.addColorStop(1,"rgba(255,200,120,0)");
     g2.fillStyle=spill;
     g2.beginPath();g2.moveTo(hx-14*s,hy);g2.lineTo(hx+26*s,hy);
     g2.lineTo(hx+70*s,hy+62*s);g2.lineTo(hx-52*s,hy+62*s);g2.closePath();g2.fill();
   }
   const wallg=g2.createLinearGradient(hx-26*s,0,hx+26*s,0);
   wallg.addColorStop(0,T==="day"?"#F2E9D6":T==="dusk"?"#543C28":"#2A2118");
   wallg.addColorStop(1,T==="day"?"#CFC2A6":T==="dusk"?"#33241A":"#191309");
   g2.fillStyle=wallg;g2.fillRect(hx-26*s,hy-20*s,52*s,22*s);
   g2.fillStyle=T==="day"?"#8A5A3B":T==="dusk"?"#2A1B12":"#140E09";
   g2.beginPath();g2.moveTo(hx-33*s,hy-20*s);g2.lineTo(hx,hy-38*s);
   g2.lineTo(hx+33*s,hy-20*s);g2.closePath();g2.fill();
   g2.strokeStyle=rgba(LI.glow,.5);g2.lineWidth=1.3;
   g2.beginPath();g2.moveTo(hx-33*s,hy-20*s);g2.lineTo(hx,hy-38*s);g2.stroke();
   g2.fillStyle=T==="day"?"rgba(255,232,190,.5)":"rgba(255,196,120,.32)";
   g2.fillRect(hx-26*s,hy-20*s,52*s,4*s);
   g2.fillStyle="rgba(255,224,164,.98)";g2.fillRect(hx+1*s,hy-15*s,11*s,10*s);
   g2.strokeStyle="rgba(80,50,24,.6)";g2.lineWidth=1;
   g2.beginPath();g2.moveTo(hx+6.5*s,hy-15*s);g2.lineTo(hx+6.5*s,hy-5*s);g2.stroke();
   g2.fillStyle=T==="day"?"#6A4A30":"#120C08";
   g2.fillRect(hx-18*s,hy-11*s,9*s,13*s);
   const tx=W*.18,ty=H*.80;
   g2.strokeStyle=T==="day"?"#5A3D28":"#150E09";g2.lineWidth=14;g2.lineCap="round";
   g2.beginPath();g2.moveTo(tx,ty);g2.lineTo(tx-4,ty-72);g2.stroke();
   g2.lineWidth=6;
   [[-42,-96],[38,-100],[-14,-120]].forEach(function(d){
     g2.beginPath();g2.moveTo(tx-4,ty-66);
     g2.quadraticCurveTo(tx+d[0]*.5,ty-92,tx+d[0],ty+d[1]+30);g2.stroke();});
   const dark=T==="day"?"#2E5A32":T==="dusk"?"#2A2C24":"#081614";
   const litc=T==="day"?"#69A552":T==="dusk"?"#4E4632":"#16262A";
   [[0,-124,60],[-44,-98,42],[46,-104,44],[-18,-150,36],[26,-144,32],[10,-112,40]]
     .forEach(function(c){
       const gr=g2.createRadialGradient(tx+c[0]-c[2]*.35,ty+c[1]-c[2]*.45,c[2]*.15,
         tx+c[0],ty+c[1],c[2]);
       gr.addColorStop(0,litc);gr.addColorStop(1,dark);
       g2.fillStyle=gr;g2.beginPath();g2.arc(tx+c[0],ty+c[1],c[2],0,7);g2.fill();
     });
   g2.strokeStyle=rgba(LI.glow,night?.16:.34);g2.lineWidth=1.6;
   [[-18,-150,36],[26,-144,32],[46,-104,44]].forEach(function(c){
     g2.beginPath();g2.arc(tx+c[0],ty+c[1],c[2],Math.PI*1.05,Math.PI*1.75);g2.stroke();});
   bloom(l,night?.30:.20,3);
   out.push({c:l.c,p:.14,figures:true});}

  {const l=layer(),g2=l.g;
   const y0=H*.93;
   const fg=g2.createLinearGradient(0,y0-10,0,H);
   fg.addColorStop(0,T==="day"?"rgba(52,86,40,.97)":"rgba(5,10,9,.97)");
   fg.addColorStop(1,T==="day"?"rgba(24,44,20,1)":"rgba(2,4,4,1)");
   g2.fillStyle=fg;
   g2.beginPath();g2.moveTo(0,H);
   for(let x=0;x<=W;x+=16)g2.lineTo(x,y0+Math.sin(x/60)*9);
   g2.lineTo(W,H);g2.closePath();g2.fill();
   for(let i=0;i<300;i++){
     const x=R()*W,y=y0+R()*44;
     g2.strokeStyle=rgba(T==="day"?"#9FCB68":LI.glow,(T==="day"?.5:.26)*(.4+R()*.7));
     g2.lineWidth=1.2;
     g2.beginPath();g2.moveTo(x,y+20);
     g2.quadraticCurveTo(x+(R()-.5)*10,y-2,x+(R()-.5)*24,y-22-R()*18);g2.stroke();
   }
   bloom(l,night?.16:.18,3);
   out.push({c:l.c,p:.30});}
  return out;
}

/* ------------------------- people in the frame -------------------------- */
function drawFigures(g,tm){
  const W=SC.w,H=SC.h,night=tod()==="night",LI=lightOf();
  const dark=tod()==="day"?"rgba(26,30,22,.9)":"rgba(5,7,11,.94)";
  if(L.world==="hng"){
    const bx=W*.45,by=H*.855,SZ=1.25;
    const sway=Math.sin(tm/2100)*1.4,sway2=Math.sin(tm/1500+1)*2.2;
    g.save();g.translate(-SC.px*.14*66,-SC.py*.14*28);
    g.fillStyle=dark;
    g.save();g.translate(bx,by);g.scale(SZ,SZ);g.rotate(sway*0.004);
    g.beginPath();g.moveTo(-13,0);g.quadraticCurveTo(-11,-38,-4,-46);
    g.quadraticCurveTo(6,-48,9,-36);g.quadraticCurveTo(13,-16,13,0);g.closePath();g.fill();

/* ============================================================================
   THE OTHER PUZZLES
   A scramble you can't see is just a string. These build the actual state.

   PYRAMINX — derived from the tetrahedron rather than copied from a table.
     Vertices U, L, R, B. Faces are vertex triples, listed counter-clockwise
     as seen from outside, which is also the order they're drawn
     (top, bottom-left, bottom-right). A turn about vertex V permutes the
     other three vertices by the cycle of the face opposite V; every sticker
     mapping falls out of that. Lowercase turns the tip alone.

   SQUARE-1 — twelve 30° units per layer; a corner occupies two, an edge one.
     (x,y) rotates the layers, "/" swaps the right halves. Scrambles are
     generated only where the slice plane falls between pieces, so every
     scramble is one the puzzle can actually do.
   ========================================================================== */

/* ------------------------------- PYRAMINX ------------------------------- */
const PY_FACES={F:["U","L","R"],L:["U","B","L"],R:["U","R","B"],D:["B","R","L"]};
const PY_OPP={U:"D",L:"R",R:"L",B:"F"};      // vertex -> the face not touching it
const PY_COL={F:"#3FA76A",L:"#3E76C8",R:"#D8493F",D:"#F2C230"};
const PY_ORDER=["F","L","R","D"];

function pyPerm(V){                           // clockwise about V, seen from outside
  const c=PY_FACES[PY_OPP[V]],p={};
  p[c[0]]=c[1];p[c[1]]=c[2];p[c[2]]=c[0];p[V]=V;
  return p;
}
function pyFaceOf(set){
  return PY_ORDER.find(f=>{
    const S=PY_FACES[f];
    return set.length===3&&set.every(v=>S.includes(v));
  });
}
function pyPos(face,kind,a,b){
  const V=PY_FACES[face],i=V.indexOf(a);
  if(kind==="tip")return [0,4,8][i];
  if(kind==="ax") return [2,5,7][i];
  const j=V.indexOf(b),k=Math.min(i,j)+""+Math.max(i,j);
  return {"01":1,"02":3,"12":6}[k];
}
function pyNew(){
  const st={};PY_ORDER.forEach((f,i)=>st[f]=Array(9).fill(i));return st;
}
function pySingle(st,V,deep){
  const pi=pyPerm(V),moves=[];
  PY_ORDER.forEach(f=>{
    const S=PY_FACES[f];
    if(!S.includes(V))return;
    const others=S.filter(x=>x!==V);
    const f2=pyFaceOf([V,pi[others[0]],pi[others[1]]]);
    moves.push([f,pyPos(f,"tip",V),f2,pyPos(f2,"tip",V)]);
    if(deep){
      moves.push([f,pyPos(f,"ax",V),f2,pyPos(f2,"ax",V)]);
      others.forEach(x=>moves.push([f,pyPos(f,"edge",V,x),f2,pyPos(f2,"edge",V,pi[x])]));
    }
  });
  const snap={};PY_ORDER.forEach(f=>snap[f]=st[f].slice());
  moves.forEach(([f,p,f2,p2])=>{st[f2][p2]=snap[f][p];});
}
function pyApply(scr){
  const st=pyNew();
  (scr||"").split(/\s+/).forEach(tok=>{
    if(!tok)return;
    const m=tok.match(/^([ULRBulrb])('?)$/);
    if(!m)return;
    const V=m[1].toUpperCase(), deep=m[1]===m[1].toUpperCase();
    const times=m[2]==="'"?2:1;               // anticlockwise == twice clockwise
    for(let i=0;i<times;i++)pySingle(st,V,deep);
  });
  return st;
}
function drawPyraminx(cv,st){
  const S=88,GAP=12,H=S*0.866;
  const W=4*S+3*GAP+16,HH=H+30;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*dpr;cv.height=HH*dpr;cv.style.width=W+"px";cv.style.height=HH+"px";
  const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,HH);
  PY_ORDER.forEach((f,fi)=>{
    const ox=8+fi*(S+GAP),oy=8,cx=ox+S/2;
    for(let r=0;r<3;r++){
      const yT=oy+r*(H/3),yB=oy+(r+1)*(H/3);
      const lT=cx-r*S/6,lB=cx-(r+1)*S/6;
      for(let c=0;c<2*r+1;c++){
        const j=c>>1,up=(c%2===0),idx=r*r+c;
        g.beginPath();
        if(up){
          g.moveTo(lT+j*S/3,yT);
          g.lineTo(lB+j*S/3,yB);
          g.lineTo(lB+(j+1)*S/3,yB);
        }else{
          g.moveTo(lT+j*S/3,yT);
          g.lineTo(lT+(j+1)*S/3,yT);
          g.lineTo(lB+(j+1)*S/3,yB);
        }
        g.closePath();
        g.fillStyle=PY_COL[PY_ORDER[st[f][idx]]];
        if(DB.settings.colorblind)g.fillStyle=["#00A0A0","#2450C8","#D2263A","#F2E14C"][st[f][idx]];
        g.fill();
        g.strokeStyle="rgba(0,0,0,.42)";g.lineWidth=.8;g.stroke();
      }
    }
    g.fillStyle="rgba(255,255,255,.42)";g.font="10px Inter, system-ui, sans-serif";
    g.textAlign="center";g.fillText(f,cx,oy+H+16);
  });
}

/* ------------------------------- SQUARE-1 ------------------------------- */
/* slot arrays of 12 units; ids 0-3 = corners, 4-7 = edges (per layer) */
function sq1Solved(){
  const mk=off=>{
    const a=[];
    for(let i=0;i<4;i++){a.push(off+i,off+i);a.push(off+4+i);}
    return a;
  };
  return {t:mk(0),b:mk(8),flip:0};
}
function sq1Rot(arr,x){
  const n=arr.length,out=Array(n);
  for(let i=0;i<n;i++)out[(i+x%n+n)%n]=arr[i];
  return out;
}
const sq1Cuttable=a=>a[11]!==a[0]&&a[5]!==a[6];
function sq1Slice(s){
  const t=s.t.slice(),b=s.b.slice();
  for(let i=0;i<6;i++){const tmp=t[i];t[i]=b[i];b[i]=tmp;}
  s.t=t;s.b=b;s.flip^=1;
}
function scrambleSq1(){
  const s=sq1Solved(),out=[];
  for(let n=0;n<11;n++){
    let x=0,y=0,tries=0;
    do{
      x=Math.floor(Math.random()*12)-5;      // -5 … 6
      y=Math.floor(Math.random()*12)-5;
      tries++;
    }while(tries<400&&!(sq1Cuttable(sq1Rot(s.t,x))&&sq1Cuttable(sq1Rot(s.b,y))));
    s.t=sq1Rot(s.t,x);s.b=sq1Rot(s.b,y);
    out.push("("+x+","+y+")");
    if(n<10){sq1Slice(s);out.push("/");}
  }
  return out.join(" ");
}
function sq1Apply(scr){
  const s=sq1Solved();
  (scr||"").split(/\s+/).forEach(tok=>{
    if(tok==="/"){sq1Slice(s);return;}
    const m=tok.match(/^\((-?\d+),(-?\d+)\)$/);
    if(!m)return;
    s.t=sq1Rot(s.t,parseInt(m[1]));
    s.b=sq1Rot(s.b,parseInt(m[2]));
  });
  return s;
}
function drawSq1(cv,s){
  const R=62,PAD=14,W=R*4+PAD*3,H=R*2+34;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";
  const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const layer=(arr,cx,cy,corner,edge,label)=>{
    // walk the ring, drawing each piece once across the units it occupies
    let i=0;
    while(i<12){
      const id=arr[i];let span=1;
      while(i+span<12&&arr[i+span]===id)span++;
      const a0=(i*30-90-15)*Math.PI/180, a1=((i+span)*30-90-15)*Math.PI/180;
      g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,a0,a1);g.closePath();
      g.fillStyle=span>1?corner:edge;g.fill();
      g.strokeStyle="rgba(0,0,0,.5)";g.lineWidth=1.1;g.stroke();
      i+=span;
    }
    g.strokeStyle="rgba(255,255,255,.30)";g.lineWidth=1.4;
    g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();
    // the slice plane
    g.strokeStyle="rgba(255,255,255,.55)";g.setLineDash([4,4]);
    g.beginPath();g.moveTo(cx,cy-R-4);g.lineTo(cx,cy+R+4);g.stroke();g.setLineDash([]);
    g.fillStyle="rgba(255,255,255,.45)";g.font="10px Inter, system-ui, sans-serif";
    g.textAlign="center";g.fillText(label,cx,cy+R+18);
  };
  layer(s.t,PAD+R,R+6,"#F2C230","#E0A93A",t("sq1Top"));

/* --------------------------- practice calendar --------------------------- */
function heatmap(){
  const wrap=el("div");
  const byDay={};
  DB.solves.forEach(s=>{const k=dayKey(s.ts);byDay[k]=(byDay[k]||0)+1;});
  const max=Math.max(1,...Object.values(byDay));
  const grid=el("div",{class:"heat"});
  const d=new Date();d.setHours(0,0,0,0);
  const start=new Date(d);start.setDate(start.getDate()-363);
  start.setDate(start.getDate()-((start.getDay()+6)%7));   // begin on a Monday
  for(let x=new Date(start);x<=d;x.setDate(x.getDate()+1)){
    const k=x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate();
    const n=byDay[k]||0;
    const a=n?0.18+0.82*Math.min(1,Math.log(1+n)/Math.log(1+max)):0;
    const cell=el("i",{title:k+(n?" · "+n:"")});
    if(n)cell.style.background=`rgba(233,201,127,${a.toFixed(2)})`;
    grid.append(cell);
  }
  wrap.append(grid);
  const days=Object.keys(byDay).length;
  wrap.append(el("p",{class:"mini",style:"margin-top:8px"},
    days+" "+t("streak").toLowerCase()+" · "+t("streak")+": "+streak()));
  return wrap;
}

/* ---------------------------- manual entry ------------------------------ */
function parseTime(str){
  const s=String(str).trim().toLowerCase();
  if(!s)return null;
  if(s==="dnf")return {ms:0,penalty:"dnf"};
  let penalty=0,body=s;
  if(body.endsWith("+2")||body.endsWith("+")){penalty=2000;body=body.replace(/\+2?$/,"").trim();}
  // 1:02.45 · 102.45 · 12.34 · 1234 (as centiseconds is ambiguous, so require a separator)
  let ms=null;
  let m=body.match(/^(\d+):(\d{1,2}(?:\.\d+)?)$/);
  if(m)ms=(parseInt(m[1])*60+parseFloat(m[2]))*1000;
  else if(/^\d+(\.\d+)?$/.test(body))ms=parseFloat(body)*1000;
  if(ms===null||!isFinite(ms)||ms<0)return null;
  return {ms:Math.round(ms),penalty};
}
function openManual(){
  $("#mnTitle").textContent=t("manualEntry");
  const b=$("#mnBody");b.innerHTML="";
  const inp=el("input",{class:"lux",placeholder:t("manualHint"),
    style:"width:100%;font-size:22px;text-align:center;font-variant-numeric:tabular-nums"});
  const msg=el("p",{class:"hint"},t("manualHint"));
  const commit=()=>{
    const r=parseTime(inp.value);
    if(!r){inp.style.borderColor="var(--bad)";return;}
    const sv={id:uid(),session:curSessionId(),puzzle:curPuzzle(),ms:r.ms,penalty:r.penalty,
      scramble,cube:DB.settings.cube||null,note:"",tags:[],ts:Date.now(),memo:null};
    DB.solves.push(sv);T.last=sv;touchDay();save();
    const list=curSolves();
    if(isPB(sv,list)){celebrate();}else speak(contextFor(sv,list),sv);
    renderStats();renderFilterBar();renderList();renderTools();
    setClock(sv.penalty==="dnf"?"DNF":fmtClock(eff(sv)),"");
    newScramble();closeAll();
  };
  inp.addEventListener("keydown",e=>{
    e.stopPropagation();
    if(e.key==="Enter")commit();
    inp.style.borderColor="";
  });
  b.append(inp,msg,el("div",{style:"display:flex;gap:8px;margin-top:14px"},
    el("button",{class:"pillbtn active",style:"flex:1",onclick:commit},t("addTime")),
    el("button",{class:"pillbtn",style:"flex:1",onclick:closeAll},t("cancel"))));
  openM("#mManual");

}

/* --------------------------- csTimer import ----------------------------- */
function importCsTimer(text){
  let data;
  try{data=JSON.parse(text);}catch(e){return 0;}
  let added=0;
  let names={};
  try{
    const props=data.properties&&data.properties.sessionData;
    if(props)names=JSON.parse(props);
  }catch(e){}
  Object.keys(data).forEach(key=>{
    const m=key.match(/^session(\d+)$/);
    if(!m)return;
    const rows=data[key];
    if(!Array.isArray(rows)||!rows.length)return;
    const meta=names[m[1]]||{};
    const ses={id:uid(),name:(meta.name||"csTimer "+m[1]),puzzle:curPuzzle(),created:Date.now()};
    DB.sessions.push(ses);
    rows.forEach(r=>{
      if(!Array.isArray(r)||!Array.isArray(r[0]))return;
      const pen=r[0][0],raw=r[0][1];
      if(typeof raw!=="number")return;
      const sv={id:uid(),session:ses.id,puzzle:ses.puzzle,ms:Math.round(raw),
        penalty:pen===-1?"dnf":pen===2000?2000:0,
        scramble:typeof r[1]==="string"?r[1]:"",
        cube:null,note:typeof r[2]==="string"?r[2]:"",tags:[],
        ts:(typeof r[3]==="number"?r[3]*1000:Date.now()),memo:null};
      DB.solves.push(sv);added++;
    });
  });
  if(added)save();
  return added;
}

  g.quadraticCurveTo(149,116,138,128);       // cheekbone into jaw
  g.quadraticCurveTo(126,143,110,152);
  g.quadraticCurveTo(94,143,82,128);
  g.quadraticCurveTo(71,116,70,92);
  g.closePath();g.fill();
  g.strokeStyle="rgba(60,36,44,.35)";g.lineWidth=1.6;g.stroke();
  /* ears */
  g.fillStyle=A.skin2;
  g.beginPath();g.ellipse(70,100,6.5,11,0,0,7);g.fill();
  g.beginPath();g.ellipse(150,100,6.5,11,0,0,7);g.fill();
  /* a little shadow where the fringe falls */
  const fsh=g.createLinearGradient(0,58,0,94);
  fsh.addColorStop(0,"rgba(90,60,80,.30)");fsh.addColorStop(1,"rgba(90,60,80,0)");
  g.save();
  g.beginPath();
  g.moveTo(70,92);g.quadraticCurveTo(70,48,110,46);g.quadraticCurveTo(150,48,150,92);
  g.lineTo(150,100);g.lineTo(70,100);g.closePath();g.clip();
  g.fillStyle=fsh;g.fillRect(60,44,100,60);
  g.restore();

  const closed=expr===EXPR.closed||avatarBlink>0;
  /* eyes — the anime part: a tall iris, a bright rim, two highlights */
  [[93,1],[127,-1]].forEach(function(e){
    const ex=e[0],dir=e[1];
    if(closed){
      g.strokeStyle="#2A1F2E";g.lineWidth=2.8;g.lineCap="round";
      g.beginPath();g.moveTo(ex-11,104);g.quadraticCurveTo(ex,110,ex+11,104);g.stroke();
    }else{
      g.fillStyle="#FFFFFF";
      g.beginPath();g.ellipse(ex,104,12.5,14.5,0,0,7);g.fill();
      const ir=g.createLinearGradient(ex,90,ex,118);
      ir.addColorStop(0,A.eyeGlow);ir.addColorStop(.55,A.eye);ir.addColorStop(1,"#1B1226");
      g.fillStyle=ir;
      g.beginPath();g.ellipse(ex+(expr===EXPR.concerned?dir*1.5:0),105,8.8,12.2,0,0,7);g.fill();
      g.fillStyle="rgba(20,12,28,.85)";
      g.beginPath();g.ellipse(ex,105,3.8,5.8,0,0,7);g.fill();
      g.fillStyle="rgba(255,255,255,.95)";
      g.beginPath();g.ellipse(ex-3.6,99,3.4,3.9,0,0,7);g.fill();
      g.fillStyle="rgba(255,255,255,.55)";
      g.beginPath();g.ellipse(ex+3.8,110,2,2,0,0,7);g.fill();
      g.strokeStyle="#241A2E";g.lineWidth=3.4;g.lineCap="round";
      g.beginPath();g.moveTo(ex-12.5,97);g.quadraticCurveTo(ex,90.5,ex+12.5,97);g.stroke();
      g.lineWidth=2.4;
      g.beginPath();g.moveTo(ex+dir*12.5,96);g.lineTo(ex+dir*17,91);g.stroke();
    }
    g.strokeStyle=A.hair2;g.lineWidth=2.0;
    const bh=expr===EXPR.concerned?(dir>0?86:84):expr===EXPR.proud?82:85;
    g.beginPath();g.moveTo(ex-11,bh+(expr===EXPR.concerned?dir*2:0));
    g.quadraticCurveTo(ex,bh-3.5,ex+11,bh-(expr===EXPR.concerned?dir*2:0));g.stroke();
  });
  /* nose and mouth */
  g.strokeStyle="rgba(120,80,70,.5)";g.lineWidth=1.6;g.lineCap="round";
  g.beginPath();g.moveTo(111,120);g.lineTo(114,126);g.stroke();
  g.strokeStyle="#9A5560";g.lineWidth=2.2;
  g.beginPath();
  if(expr===EXPR.proud||expr===EXPR.warm){
    g.moveTo(103,136);g.quadraticCurveTo(111,expr===EXPR.proud?144:141,119,136);
  }else if(expr===EXPR.concerned){
    g.moveTo(105,139);g.quadraticCurveTo(111,135,118,139);
  }else{g.moveTo(105,137);g.lineTo(118,137);}
  g.stroke();
  /* blush */
  if(expr===EXPR.warm||expr===EXPR.proud){
    g.fillStyle="rgba(226,130,140,.28)";
    g.beginPath();g.ellipse(86,123,11,6,0,0,7);g.fill();
    g.beginPath();g.ellipse(136,123,11,6,0,0,7);g.fill();
  }

  /* hair in front — pointed strands, drawn one at a time */
  g.fillStyle=A.hair;
  g.beginPath();
  g.moveTo(66,96);
  g.quadraticCurveTo(60,44,110,38);
  g.quadraticCurveTo(160,44,154,96);
  g.lineTo(150,72);
  g.lineTo(143,88); g.lineTo(136,62);         // strand tips, stopping above the brow
  g.lineTo(128,84); g.lineTo(116,58);
  g.lineTo(108,80); g.lineTo(96,60);
  g.lineTo(88,86);  g.lineTo(80,64);
  g.lineTo(72,80);
  g.closePath();g.fill();
  g.strokeStyle="rgba(30,20,36,.30)";g.lineWidth=1.4;g.stroke();
  if(A.style==="long"){
    g.fillStyle=A.hair;
    g.beginPath();g.moveTo(66,94);g.quadraticCurveTo(52,142,62,190);
    g.quadraticCurveTo(72,150,78,106);g.closePath();g.fill();
    g.beginPath();g.moveTo(154,94);g.quadraticCurveTo(168,142,158,190);
    g.quadraticCurveTo(148,150,142,106);g.closePath();g.fill();
  }else if(A.style==="wave"){
    g.fillStyle=A.hair;
    g.beginPath();g.moveTo(66,94);g.quadraticCurveTo(48,134,68,168);
    g.quadraticCurveTo(72,134,78,104);g.closePath();g.fill();
    g.beginPath();g.moveTo(154,94);g.quadraticCurveTo(172,134,152,168);
    g.quadraticCurveTo(148,134,142,104);g.closePath();g.fill();
  }else{
    g.fillStyle=A.hair;
    g.beginPath();g.moveTo(66,96);g.quadraticCurveTo(62,126,72,140);
    g.quadraticCurveTo(74,118,78,102);g.closePath();g.fill();
    g.beginPath();g.moveTo(154,96);g.quadraticCurveTo(158,126,148,140);
    g.quadraticCurveTo(146,118,142,102);g.closePath();g.fill();
  }
  /* a highlight band across the hair, the way it is always drawn */
  g.save();g.globalAlpha=.20;g.fillStyle="#FFFFFF";
  g.beginPath();
  g.moveTo(78,66);g.quadraticCurveTo(110,54,142,66);
  g.quadraticCurveTo(134,74,126,68);g.quadraticCurveTo(110,62,94,70);
  g.quadraticCurveTo(86,74,78,66);g.closePath();g.fill();g.restore();
  /* the small ornament that says which world this is */
  if(A.accent==="star"){
    g.fillStyle=A.trim;
    const sx=150,sy=58,r=8;
    g.beginPath();
    for(let i=0;i<10;i++){
      const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.44:r;
      g.lineTo(sx+Math.cos(a)*rr,sy+Math.sin(a)*rr);
    }
    g.closePath();g.fill();
  }else if(A.accent==="shell"){
    g.fillStyle=A.trim;
    g.beginPath();g.arc(150,60,8,Math.PI,0);g.closePath();g.fill();
    g.strokeStyle="rgba(0,0,0,.25)";g.lineWidth=1;
    for(let i=1;i<4;i++){g.beginPath();g.arc(150,60,i*2.2,Math.PI,0);g.stroke();}
  }
  g.restore();
  // vignette so it sits into the frame
  const vg=g.createRadialGradient(W/2,H/2,W*.28,W/2,H/2,W*.62);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.42)");
  g.fillStyle=vg;g.fillRect(0,0,W,H);
}
function exprFor(ctx){
  return {pb:EXPR.proud,fast:EXPR.proud,first:EXPR.warm,back:EXPR.warm,
          dnf:EXPR.concerned,slow:EXPR.concerned,flat:EXPR.concerned,
          late:EXPR.warm,many:EXPR.warm,any:EXPR.warm}[ctx]||EXPR.warm;
}
function paintAvatars(){
  ["#portrait","#vnFace"].forEach(function(sel){
    const cv=$(sel);if(!cv)return;
    const g=cv.getContext("2d");
    drawAvatar(g,cv.width,cv.height,L.world,avatarExpr,0);
  });
}
function setAvatarExpr(e){avatarExpr=e;paintAvatars();}
function startBlinking(){
  clearInterval(avatarTimer);
  avatarTimer=setInterval(function(){
    if(document.hidden)return;
    avatarBlink=1;paintAvatars();
    setTimeout(function(){avatarBlink=0;paintAvatars();},130);
  },4200+Math.random()*2600);
}
